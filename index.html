<title>SHERPA Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room console — app bar, numbered stage rail (a real sequence), work area with list | detail split. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#cfd6d3; --line-strong:#9aa7a2;
  --ink:#16201d; --ink-2:#4a5853; --ink-3:#6f7d78;
  --accent:#0d5c63; --accent-ink:#ffffff; --accent-soft:#d7e9ea;
  --signal:#b86e00; --signal-soft:#fbeed8;
  --hi:#b42318; --hi-soft:#fde4e1; --med:#a15c00; --med-soft:#fdf0d5; --lo:#2f7d4f; --lo-soft:#dff1e5;
  --focus:#1f7a8c;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#172020; --sunk:#0c1211; --line:#2c3836; --line-strong:#4d5d59;
  --ink:#e4ebe8; --ink-2:#a8b6b1; --ink-3:#7f8e89;
  --accent:#5fb6bd; --accent-ink:#061414; --accent-soft:#16383b;
  --signal:#f0a640; --signal-soft:#3a2a10;
  --hi:#ff8a7a; --hi-soft:#43201c; --med:#f2b55a; --med-soft:#3b2c12; --lo:#7fd39d; --lo-soft:#173323;
  --focus:#7fd0d8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#172020; --sunk:#0c1211; --line:#2c3836; --line-strong:#4d5d59;
  --ink:#e4ebe8; --ink-2:#a8b6b1; --ink-3:#7f8e89;
  --accent:#5fb6bd; --accent-ink:#061414; --accent-soft:#16383b;
  --signal:#f0a640; --signal-soft:#3a2a10;
  --hi:#ff8a7a; --hi-soft:#43201c; --med:#f2b55a; --med-soft:#3b2c12; --lo:#7fd39d; --lo-soft:#173323;
  --focus:#7fd0d8; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:22px} h3{font-size:17px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:12.5px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#root{min-height:100%;display:flex;flex-direction:column}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.study-name{min-width:0;flex:1 1 220px;display:flex;align-items:center;gap:8px}
.study-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.save-state{font-size:12px;color:var(--ink-3);white-space:nowrap}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}

/* Stage rail */
.rail{background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.rail-in{display:flex;gap:2px;padding-block:0}
.stage{appearance:none;border:0;background:none;padding:10px 12px 9px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--ink-2)}
.stage:hover{color:var(--ink)}
.stage[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.stage .num{font-family:var(--f-mono);font-size:11.5px;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-strong)}
.stage[aria-current="step"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage .lbl{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.dot.ok{background:var(--lo)} .dot.warn{background:var(--signal)}

/* Main */
main{flex:1;padding-block:18px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head p{margin:4px 0 0;max-width:70ch;color:var(--ink-2)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.split.wide-left{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}
.split.list-left{grid-template-columns:minmax(260px,.8fr) minmax(0,2fr)}
@media (max-width:900px){.split,.split.wide-left,.split.list-left{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:16px}
.panel-b{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
@media (max-width:900px){.sticky{position:static}}

/* Controls */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 45%,var(--line))}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
label.f > span.hint{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:6px 8px;font-size:13.5px;width:100%;min-width:0;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:58px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.risk button[data-v="3"][aria-pressed="true"]{background:var(--hi);color:#fff}
.seg.risk button[data-v="2"][aria-pressed="true"]{background:var(--med);color:#fff}
.seg.risk button[data-v="1"][aria-pressed="true"]{background:var(--lo);color:#fff}

/* Pills & badges */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill.hi{background:var(--hi-soft);color:var(--hi);border-color:color-mix(in srgb,var(--hi) 35%,transparent)}
.pill.med{background:var(--med-soft);color:var(--med);border-color:color-mix(in srgb,var(--med) 35%,transparent)}
.pill.lo{background:var(--lo-soft);color:var(--lo);border-color:color-mix(in srgb,var(--lo) 35%,transparent)}
.pill.none{background:var(--sunk);color:var(--ink-3)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.sig{background:var(--signal-soft);color:var(--signal)}
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--sunk);border-radius:4px;padding:0 5px}

/* Outline editor */
.outline{display:flex;flex-direction:column}
.ol-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:6px;padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
.ol-row.sel{background:var(--accent-soft)}
.ol-row .num{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);min-width:38px;text-align:right}
.ol-row input{border:1px solid transparent;background:transparent;padding:4px 6px}
.ol-row input:hover{border-color:var(--line)}
.ol-row .meta{display:flex;gap:4px;align-items:center}
.tw{appearance:none;border:0;background:none;width:18px;height:18px;cursor:pointer;color:var(--ink-3);padding:0;font-size:11px}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}

/* Diagram */
.diagram-wrap{overflow:auto;max-height:70vh;background:var(--sunk);border-radius:0 0 var(--r) var(--r)}
.diagram-wrap svg{display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl textarea,.tbl input,.tbl select{font-size:12.5px;padding:4px 6px}
.tbl textarea{min-height:44px}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.tbl tr.sel td{background:var(--accent-soft)}

/* Lists (step pickers) */
.list{display:flex;flex-direction:column;max-height:70vh;overflow:auto}
.li{appearance:none;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start}
.li:hover{background:var(--sunk)}
.li[aria-current="true"]{background:var(--accent-soft)}
.li .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:1px}

/* Cards */
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.card.flag{border-left:4px solid var(--signal)}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice{border:1px solid color-mix(in srgb,var(--signal) 40%,var(--line));background:var(--signal-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.notice.info{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft)}
.gate{display:flex;flex-direction:column;gap:6px}
.gate ul{margin:0;padding-left:18px}
.gate li{margin:2px 0}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--surface);min-width:110px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-2)}

/* Rating scale */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.scale button{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:5px 4px;cursor:pointer;font-size:11.5px;line-height:1.2;text-align:center}
.scale button b{display:block;font-family:var(--f-mono);font-size:12.5px}
.scale button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.scale button[data-v="100"][aria-pressed="true"]{background:var(--hi-soft)}
.scale button[data-v="75"][aria-pressed="true"]{background:var(--med-soft)}
.scale button[data-v="50"][aria-pressed="true"]{background:var(--sunk)}
.scale button[data-v="25"][aria-pressed="true"],.scale button[data-v="0"][aria-pressed="true"]{background:var(--lo-soft)}
@media (max-width:640px){.scale{grid-template-columns:repeat(5,minmax(52px,1fr));overflow-x:auto}}
.meter{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden;min-width:80px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 30px 18px;display:flex;flex-direction:column;gap:12px}
.modal-scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:8px;max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:70;font-size:13px;max-width:90vw}
dl.gloss{margin:0;display:flex;flex-direction:column;gap:10px}
dl.gloss dt{font-weight:600;font-family:var(--f-display);font-size:15.5px}
dl.gloss dd{margin:2px 0 0;color:var(--ink-2)}

/* Procedure preview (document look) */
.doc{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:4px;padding:28px;font-family:var(--f-body);max-width:860px}
.doc h1{font-family:var(--f-display);font-size:24px;color:#0d3b40}
.doc h2{font-family:var(--f-display);font-size:17px;margin:18px 0 6px;color:#0d3b40}
.doc .hdr{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid #9aa;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px}
.doc th,.doc td{border:1px solid #9aa;padding:5px 7px;vertical-align:top;text-align:left}
.doc th{background:#e3ecec}
.doc tr.crit td{background:#fdecea}
.doc .warn{color:#9b1c10;font-weight:600}
.doc img{max-width:180px;display:block;margin-top:4px;border:1px solid #ccc}
.doc .box{border:1px solid #9aa;padding:8px 10px;margin-bottom:10px;font-size:13px;white-space:pre-wrap}
@media (max-width:640px){.doc{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none}}
</style>
<div id="root"><div class="wrap" style="padding-block:40px"><p>Loading SHERPA Studio…</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ===================== Reference libraries ===================== */
const ACTIVITY_TYPES = [
  {code:'ACT', name:'Action', desc:'Operating, connecting, opening, closing, adjusting equipment'},
  {code:'CH',  name:'Checking', desc:'Confirming a state, condition or result before or after an action'},
  {code:'MON', name:'Monitoring', desc:'Watching a process or value over time and reacting to change'},
  {code:'COM', name:'Communication', desc:'Passing or receiving information between people'},
  {code:'RET', name:'Retrieval', desc:'Obtaining information from a document, display or person'},
  {code:'SEL', name:'Selection', desc:'Choosing one option, item or route among several'}
];
const ERROR_MODES = [
  {code:'ACT1',a:'ACT',name:'Action omitted',q:'What if this step is not done at all?',demo:false},
  {code:'ACT2',a:'ACT',name:'Action incomplete',q:'What if the step is started but not finished?',demo:false},
  {code:'ACT3',a:'ACT',name:'Action too long / too short',q:'What if it is held or run for the wrong duration?',demo:false},
  {code:'ACT4',a:'ACT',name:'Action mistimed (too early / too late)',q:'What if it is done out of sequence or at the wrong time?',demo:false},
  {code:'ACT5',a:'ACT',name:'Action in wrong direction',q:'What if the valve, switch or control is moved the wrong way?',demo:false},
  {code:'ACT6',a:'ACT',name:'Action too little / too much',q:'What if too little or too much force, quantity or adjustment is applied?',demo:false},
  {code:'ACT7',a:'ACT',name:'Right action on wrong object',q:'What if the correct action is done on a similar, nearby item?',demo:true},
  {code:'ACT8',a:'ACT',name:'Wrong action on right object',q:'What if the right item gets the wrong action?',demo:false},
  {code:'ACT9',a:'ACT',name:'Misalignment',q:'What if parts are connected or positioned out of line?',demo:false},
  {code:'ACT10',a:'ACT',name:'Wrong action on wrong object',q:'What if both the action and the item are wrong?',demo:false},
  {code:'CH1',a:'CH',name:'Check omitted',q:'What if the check is skipped?',demo:true},
  {code:'CH2',a:'CH',name:'Check incomplete',q:'What if the check is only partly done or not thorough?',demo:true},
  {code:'CH3',a:'CH',name:'Wrong object or action checked',q:'What if the wrong item, gauge or light is checked?',demo:true},
  {code:'CH4',a:'CH',name:'Wrong check',q:'What if the right item is checked in the wrong way or against the wrong value?',demo:true},
  {code:'CH5',a:'CH',name:'Check too late / early',q:'What if the check happens before or after the moment it matters?',demo:true},
  {code:'MON1',a:'MON',name:'Monitoring omitted',q:'What if no one watches the process?',demo:true},
  {code:'MON2',a:'MON',name:'Wrong person or process monitored',q:'What if attention is on the wrong unit, tank or person?',demo:true},
  {code:'MON3',a:'MON',name:'Monitoring incomplete or interrupted (e.g. following a shift change)',q:'What if monitoring stops part way, for example at a handover?',demo:true},
  {code:'MON4',a:'MON',name:'Incorrect values monitored',q:'What if the wrong parameter or limit is watched?',demo:true},
  {code:'COM1',a:'COM',name:'Information not communicated',q:'What if the message is never passed on?',demo:false},
  {code:'COM2',a:'COM',name:'Wrong information communicated',q:'What if the wrong value, item or instruction is passed on?',demo:false},
  {code:'COM3',a:'COM',name:'Information communication incomplete',q:'What if only part of the message gets through?',demo:false},
  {code:'RET1',a:'RET',name:'Information not obtained',q:'What if the person never gets the information they need?',demo:false},
  {code:'RET2',a:'RET',name:'Wrong information obtained',q:'What if they read the wrong line, display or document?',demo:false},
  {code:'RET3',a:'RET',name:'Information retrieval incomplete',q:'What if they get only part of what they need?',demo:false},
  {code:'SEL1',a:'SEL',name:'Selection omitted',q:'What if no selection is made and a default is used?',demo:false},
  {code:'SEL2',a:'SEL',name:'Wrong selection made',q:'What if the wrong option, tank or route is chosen?',demo:false}
];
const ERROR_TYPES = [
  {v:'Slip', d:'Right intention, wrong execution (e.g. the hand goes to the wrong switch).'},
  {v:'Lapse', d:'A step forgotten or lost from memory (e.g. distracted and never returned to it).'},
  {v:'Mistake', d:'A wrong plan or decision, done as intended (e.g. misjudging what the reading means).'},
  {v:'Non-compliance', d:'A deliberate departure from the rule, usually for a reason worth finding.'}
];

const uid = (p='n') => p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

function newNode(label='', extra={}){

    warnings:'',comments:'',tags:'',risk:0,riskReason:'',plan:{type:'seq',text:''},critical:false,photos:[],link:null},extra);
}
function newMap(goal=''){
  const root = newNode(goal||'Insert overall task goal',{type:'goal'});

}
function newStudy(title='Untitled study'){
  return {id:uid('s'),schema:1,created:new Date().toISOString(),updated:new Date().toISOString(),
    meta:{title,goal:'',site:'',facility:'',studyType:'SCTA',revision:'A',date:today(),owner:'',team:'',interviewees:'',preconditions:'',notes:'',ratingMode:'simple',isExample:false},
    agents:[],locations:[],
    maps:{wai:newMap(),wad:newMap()},
    gaps:{},analyses:[],competence:{},gateNotes:{},audit:[]};
}
function addChild(map,parentId,label='',idx=null,extra={}){
  const n = newNode(label,extra); n.parent=parentId; map.nodes[n.id]=n;
  const p = map.nodes[parentId]; if(idx==null||idx>p.children.length) p.children.push(n.id); else p.children.splice(idx,0,n.id);
  return n;
}
function removeNode(map,id){
  const n = map.nodes[id]; if(!n||id===map.rootId) return;
  const kill = x => { (map.nodes[x]?.children||[]).forEach(kill); delete map.nodes[x]; };
  const p = map.nodes[n.parent]; if(p) p.children = p.children.filter(c=>c!==id);
  kill(id);
}
function walk(map,fn){
  const go=(id,depth)=>{ const n=map.nodes[id]; if(!n) return; fn(n,depth); n.children.forEach(c=>go(c,depth+1)); };
  go(map.rootId,0);
}
function numbering(map){
  const out={}; const go=(id,prefix)=>{ const n=map.nodes[id]; if(!n) return; n.children.forEach((c,i)=>{ const num = prefix?prefix+'.'+(i+1):String(i+1); out[c]=num; go(c,num); }); };
  out[map.rootId]='0'; go(map.rootId,''); return out;
}
function ordered(map){ const a=[]; walk(map,(n,d)=>{ if(n.id!==map.rootId) a.push({n,d}); }); return a; }
function leavesOf(map){ return ordered(map).filter(x=>x.n.children.length===0).map(x=>x.n); }
function indentNode(map,id){
  const n=map.nodes[id]; const p=map.nodes[n.parent]; const i=p.children.indexOf(id); if(i<=0) return false;
  const prev=map.nodes[p.children[i-1]]; p.children.splice(i,1); prev.children.push(id); n.parent=prev.id; return true;
}
function outdentNode(map,id){
  const n=map.nodes[id]; const p=map.nodes[n.parent]; if(!p||p.id===map.rootId) return false;
  const gp=map.nodes[p.parent]; p.children=p.children.filter(c=>c!==id); const pi=gp.children.indexOf(p.id); gp.children.splice(pi+1,0,id); n.parent=gp.id; return true;
}
function moveNode(map,id,dir){
  const n=map.nodes[id]; const p=map.nodes[n.parent]; if(!p) return; const i=p.children.indexOf(id); const j=i+dir; if(j<0||j>=p.children.length) return;
  p.children.splice(i,1); p.children.splice(j,0,id);
}
function copyMapWithLinks(src){
  const m={rootId:null,nodes:{},source:src.source,capturedOn:today()};
  const go=(id,parent)=>{ const s=src.nodes[id]; const n=clone(s); n.id=uid('n'); n.parent=parent; n.children=[]; n.link=s.id; n.risk=0; n.riskReason='';
    m.nodes[n.id]=n; if(parent) m.nodes[parent].children.push(n.id); else m.rootId=n.id; s.children.forEach(c=>go(c,n.id)); };
  go(src.rootId,null); return m;
}
const agentLabel = (st,ids) => (ids||[]).map(i=>st.agents.find(a=>a.id===i)?.abbr||'').filter(Boolean).join(' / ');
const agentNames = (st,ids) => (ids||[]).map(i=>{const a=st.agents.find(x=>x.id===i); return a? `${a.name}${a.abbr?' ('+a.abbr+')':''}`:'';}).filter(Boolean).join(' / ');
const modeOf = code => ERROR_MODES.find(m=>m.code===code);
const riskName = r => ({3:'High',2:'Medium',1:'Low'})[r]||'Not screened';
const riskCls = r => ({3:'hi',2:'med',1:'lo'})[r]||'none';

/* ===== Scoring ===== */
function anScore(an,which='baseline',mode='simple'){
  const ps=an.pifs||[]; if(!ps.length) return null; let s=0,w=0;
  ps.forEach(p=>{ const wt = mode==='enhanced'?(p.weight||1):1; const v = which==='modified' ? (p.modified==null?p.baseline:p.modified) : p.baseline; s+=v*wt; w+=wt; });
  return w? Math.round(s/w):null;
}
function priorityOf(an,node,mode){
  const sc=anScore(an,'baseline',mode); const r=node?.risk||0; if(sc==null) return null;
  if(r===3&&sc>=60) return 1; if((r===3)||(r===2&&sc>=60)) return 2; return 3;
}
const flaggedPifs = an => (an.pifs||[]).filter(p=>p.baseline>=75);
function scoreColor(v){ if(v==null) return 'var(--line-strong)'; if(v>=75) return 'var(--hi)'; if(v>=60) return 'var(--med)'; if(v>=40) return 'var(--signal)'; return 'var(--lo)'; }

/* ===== Compare WAI vs WAD ===== */
function words(s){ return new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2)); }
function similarity(a,b){ const A=words(a),B=words(b); if(!A.size&&!B.size) return 1; let i=0; A.forEach(w=>{if(B.has(w)) i++;}); return i/Math.max(1,Math.min(A.size,B.size)); }
function compareMaps(st){
  const wai=st.maps.wai, wad=st.maps.wad; const rows=[];
  const waiLeaves=leavesOf(wai); if(!waiLeaves.length) return rows;
  const waiIdx=Object.fromEntries(waiLeaves.map((n,i)=>[n.id,i]));
  const wadNums=numbering(wad), waiNums=numbering(wai);
  const linkedBy={}; ordered(wad).forEach(({n})=>{ if(n.link&&wai.nodes[n.link]) (linkedBy[n.link]=linkedBy[n.link]||[]).push(n); });
  let maxSeen=-1;
  leavesOf(wad).forEach(n=>{
    if(!n.link||!wai.nodes[n.link]){ rows.push({key:n.id,kind:'Added',wad:n,wai:null,wadNum:wadNums[n.id]}); return; }
    const w=wai.nodes[n.link]; const flags=[];
    const idx=waiIdx[w.id]; if(idx!=null){ if(idx<maxSeen) flags.push('Moved'); maxSeen=Math.max(maxSeen,idx); }
    const aW=agentLabel(st,w.agents), aD=agentLabel(st,n.agents); if(aW&&aD&&aW!==aD) flags.push('Re-assigned');
    if(similarity(w.label,n.label)<0.5) flags.push('Re-worded');
    if((linkedBy[w.id]||[]).length>1 && linkedBy[w.id][0].id===n.id) flags.push('Split');
    if(flags.length) rows.push({key:n.id,kind:flags.join(', '),wad:n,wai:w,wadNum:wadNums[n.id],waiNum:waiNums[w.id],ref:w.ref});
  });
  waiLeaves.forEach(w=>{ if(!linkedBy[w.id]) rows.push({key:w.id,kind:'Missing',wad:null,wai:w,waiNum:waiNums[w.id],ref:w.ref}); });
  return rows;
}

/* ===== Gates ===== */
function gates(st){
  const g={}; const wad=st.maps.wad; const wadLeaves=leavesOf(wad); const nums=numbering(wad);
  const setupIssues=[]; if(!st.meta.title||st.meta.title==='Untitled study') setupIssues.push('Give the study a title');
  if(!st.meta.goal) setupIssues.push('State the task goal'); if(!st.agents.length) setupIssues.push('Add at least one Agent/Person (role)');
  if(!st.meta.interviewees) setupIssues.push('Record who described work as done (interviewees)');
  g.setup=setupIssues;
  const mapIssues=[]; if(!wadLeaves.length) mapIssues.push('Build the work-as-done map (it has no steps yet)');
  const noAgent=wadLeaves.filter(n=>!n.agents.length); if(noAgent.length) mapIssues.push(`${noAgent.length} step(s) have no Agent/Person, e.g. ${nums[noAgent[0].id]}`);
  const empty=ordered(wad).filter(x=>!x.n.label.trim()); if(empty.length) mapIssues.push(`${empty.length} box(es) have no label`);
  const condNoText=ordered(wad).filter(x=>x.n.children.length&&x.n.plan.type==='cond'&&!x.n.plan.text.trim()); if(condNoText.length) mapIssues.push(`${condNoText.length} conditional plan(s) have no rule text`);
  g.map=mapIssues;
  const cmp=compareMaps(st); const undecided=cmp.filter(r=>!(st.gaps[r.key]?.decision)); g.compare = leavesOf(st.maps.wai).length? (undecided.length?[`${undecided.length} of ${cmp.length} differences have no decision yet`]:[]) : ['No work-as-imagined map to compare (optional: import the procedure in stage 2)'];
  const unscr=wadLeaves.filter(n=>!n.risk); const noReason=wadLeaves.filter(n=>n.risk>=2&&!n.riskReason.trim());
  g.screen=[]; if(unscr.length) g.screen.push(`${unscr.length} step(s) not screened`); if(noReason.length) g.screen.push(`${noReason.length} Medium/High step(s) have no reason`);
  const carried=wadLeaves.filter(n=>n.risk>=2); g.errors=[];
  carried.forEach(n=>{ const ans=st.analyses.filter(a=>a.nodeId===n.id); if(!n.activity) g.errors.push(`${nums[n.id]} has no activity type`);
    else if(!ans.length && !n.noneCredible) g.errors.push(`${nums[n.id]} has no error mode (or a "none credible" reason)`);
    ans.filter(a=>a.credible).forEach(a=>{ if(!a.errorType||!a.consequence||!(a.consTypes||[]).length) g.errors.push(`${nums[n.id]} ${a.mode}: error type, consequence or consequence type missing`); });
  });
  g.pifs=[]; st.analyses.filter(a=>a.credible&&wad.nodes[a.nodeId]).forEach(a=>{ const n=wad.nodes[a.nodeId];
    if((a.pifs||[]).length<3) g.pifs.push(`${nums[n.id]} ${a.mode}: ${(a.pifs||[]).length} PIF(s) rated, 3 expected`);
    const nr=(a.pifs||[]).filter(p=>p.baseline!==50&&!String(p.reason||'').trim()); if(nr.length) g.pifs.push(`${nums[n.id]} ${a.mode}: ${nr.length} rating(s) without a reason`); });
  g.controls=[]; st.analyses.filter(a=>a.credible&&wad.nodes[a.nodeId]).forEach(a=>{ const n=wad.nodes[a.nodeId];
    flaggedPifs(a).forEach(p=>{ const has=(a.improvements||[]).some(i=>i.status!=='Rejected'&&(i.pifIds||[]).includes(p.id)); if(!has&&!String(p.noControlReason||'').trim()) g.controls.push(`${nums[n.id]} ${a.mode}: "${p.name}" (${p.baseline}) has no improvement`); });
    (a.improvements||[]).filter(i=>i.status!=='Rejected'&&(!i.owner||!i.due)).forEach(()=>g.controls.push(`${nums[n.id]} ${a.mode}: an improvement has no owner or due date`)); });
  g.outputs=[]; g.grid=[];
  return g;
}

/* ---- diagram layout + SVG ---- */
function diagramSVG(st,map,opt){
  const {colorBy='agent',collapsed={},sel=null,forExport=false}=opt||{};
  const BW=184,BH=70,HG=20,VG=30,PH=20,SI=26,SG=12,M=24;
  const nums=numbering(map);
  const C = forExport ? {ink:'#16201d',ink2:'#4a5853',line:'#7f8e89',box:'#ffffff',bg:'#ffffff',accent:'#0d5c63',sel:'#1f7a8c',plan:'#f3f5f4',hi:'#f6c8c2',med:'#f8dfae',lo:'#cfe9d8'}
    : {ink:'var(--ink)',ink2:'var(--ink-2)',line:'var(--line-strong)',box:'var(--surface)',bg:'var(--sunk)',accent:'var(--accent)',sel:'var(--focus)',plan:'var(--surface)',hi:'var(--hi-soft)',med:'var(--med-soft)',lo:'var(--lo-soft)'};
  const kids=id=> collapsed[id]?[]:(map.nodes[id]?.children||[]);
  const meas={};
  const measure=id=>{ const k=kids(id); let r;
    if(!k.length) r={w:BW,h:BH,mode:'leaf'};
    else if(k.every(c=>!kids(c).length)) r={w:SI+BW,h:BH+PH+VG/2+k.length*(BH+SG),mode:'stack'};
    else { k.forEach(measure); const cw=k.reduce((s,c)=>s+meas[c].w,0)+HG*(k.length-1); r={w:Math.max(BW,cw),h:BH+PH+VG+Math.max(...k.map(c=>meas[c].h)),mode:'row',cw}; }
    if(r.mode==='stack') k.forEach(measure);
    meas[id]=r; return r; };
  measure(map.rootId);
  const parts=[]; const lines=[];
  const fillFor=n=>{
    if(n.id===map.rootId) return forExport?'#d7e9ea':'var(--accent-soft)';
    if(colorBy==='risk') return n.risk===3?C.hi:n.risk===2?C.med:n.risk===1?C.lo:C.box;
    if(colorBy==='agent'){ const a=st.agents.find(x=>x.id===n.agents[0]); return a?a.color+'44':C.box; }
    if(colorBy==='where'){ const l=st.locations.find(x=>x.id===n.where); return l?l.color+'44':C.box; }
    if(colorBy==='activity'){ const i=ACTIVITY_TYPES.findIndex(a=>a.code===n.activity); return i>=0?PALETTE[i]+'44':C.box; }
    return C.box; };
  const box=(n,x,y)=>{
    const isSel=n.id===sel; const lab=wrapText(n.label||'(untitled)',27,3); const ap=agentLabel(st,n.agents);
    const hasKids=(map.nodes[n.id].children||[]).length>0;
    let g=`<g data-id="${n.id}" style="cursor:pointer">`;
    if(n.id!==map.rootId) g+=`<text x="${x}" y="${y-5}" font-size="11" font-family="IBM Plex Mono,monospace" fill="${C.ink2}">${esc(nums[n.id])}${n.critical?'  ◆ critical':''}</text>`;
    else g+=`<text x="${x}" y="${y-5}" font-size="11" font-weight="600" fill="${C.ink2}" letter-spacing="0.06em">GOAL</text>`;
    g+=`<rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="7" fill="${fillFor(n)}" stroke="${isSel?C.sel:(n.id===map.rootId?C.accent:C.line)}" stroke-width="${isSel?2.5:1}"/>`;
    lab.forEach((t,i)=>{ g+=`<text x="${x+9}" y="${y+17+i*14}" font-size="12" font-family="IBM Plex Sans,Arial,sans-serif" fill="${C.ink}" ${n.id===map.rootId?'font-weight="600"':''}>${esc(t)}</text>`; });
    if(ap) g+=`<text x="${x+9}" y="${y+BH-8}" font-size="10.5" font-family="IBM Plex Sans,Arial,sans-serif" fill="${C.accent}" font-weight="600">A/P: ${esc(ap)}</text>`;
    if(n.warnings) g+=`<text x="${x+BW-10}" y="${y+BH-8}" font-size="12" text-anchor="end" fill="#b42318" font-weight="700">!</text>`;
    if(hasKids&&!forExport) g+=`<g data-tog="${n.id}"><rect x="${x+BW-20}" y="${y+4}" width="16" height="16" rx="3" fill="${C.box}" stroke="${C.line}"/><text x="${x+BW-12}" y="${y+16}" text-anchor="middle" font-size="12" fill="${C.ink2}">${collapsed[n.id]?'+':'−'}</text></g>`;
    g+='</g>'; parts.push(g); };
  const planText=n=>{ const p=n.plan||{}; const lab=p.type==='cond'?(p.text||'Conditional'):(PLAN_TYPES.find(t=>t.v===p.type)?.l||'Do in sequence'); return `Plan ${nums[n.id]}: ${lab}`; };
  const place=(id,x,y)=>{ const n=map.nodes[id], m=meas[id], k=kids(id);
    if(m.mode==='leaf'){ box(n,x,y); return; }
    if(m.mode==='stack'){ box(n,x,y); const pt=wrapText(planText(n),40,1)[0]; parts.push(`<text x="${x+SI}" y="${y+BH+14}" font-size="10.5" font-style="italic" fill="${C.ink2}">${esc(pt)}</text>`);
      const sx=x+12; let last=0; k.forEach((c,i)=>{ const cy=y+BH+PH+VG/2+i*(BH+SG); box(map.nodes[c],x+SI,cy); last=cy+BH/2; lines.push(`M${sx} ${cy+BH/2}H${x+SI}`); });
      lines.push(`M${sx} ${y+BH}V${last}`); return; }
    let bx=x+(m.w-BW)/2; if(id===map.rootId&&k.length){ const f=meas[k[0]]; bx=x+(m.w-m.cw)/2+(f.mode==='row'?f.w/2-BW/2:0); } box(n,bx,y); const cx=bx+BW/2;
    const pt=wrapText(planText(n),44,1)[0]; const pw=Math.min(300,pt.length*6.1+16);
    parts.push(`<rect x="${cx-pw/2}" y="${y+BH+6}" width="${pw}" height="${PH-2}" rx="9" fill="${C.plan}" stroke="${C.line}" stroke-dasharray="3 2"/><text x="${cx}" y="${y+BH+19}" text-anchor="middle" font-size="10.5" font-style="italic" fill="${C.ink2}">${esc(pt)}</text>`);
    lines.push(`M${cx} ${y+BH}V${y+BH+6}`);
    const busY=y+BH+PH+VG/2+4; lines.push(`M${cx} ${y+BH+PH+4}V${busY}`);
    let cxs=[]; let ox=x+(m.w-m.cw)/2; k.forEach(c=>{ const cm=meas[c]; const ccx = cm.mode==='row' ? ox+cm.w/2 : ox + (cm.mode==='stack'?BW/2:BW/2); cxs.push(ccx); place(c,ox,y+BH+PH+VG); ox+=cm.w+HG; });
    lines.push(`M${Math.min(...cxs)} ${busY}H${Math.max(...cxs)}`); cxs.forEach(c=>lines.push(`M${c} ${busY}V${y+BH+PH+VG}`));
  };
  const W=meas[map.rootId].w+M*2, H=meas[map.rootId].h+M*2+10;
  place(map.rootId,M,M+12);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Task map: ${esc(map.nodes[map.rootId].label)}">${forExport?`<rect width="${W}" height="${H}" fill="${C.bg}"/>`:''}<path d="${lines.join('')}" fill="none" stroke="${C.line}" stroke-width="1.2"/>${parts.join('')}</svg>`;
  return svg;
}

/* ===================== Home ===================== */
function Home({open,notify,ask}){
  const [idx,setIdx]=useState(()=>LS.get(IDX,[]));
  const fileRef=useRef(null);
  const openId=id=>{ const s=LS.get(SK(id),null); if(s) open(s); else notify('That study could not be found in this browser'); };
  const del=id=>ask({title:'Delete this study?',body:'It is removed from this browser. Save a study file first if you may need it again.',okLabel:'Delete',danger:true,ok:()=>{ LS.del(SK(id)); const n=LS.get(IDX,[]).filter(x=>x.id!==id); LS.set(IDX,n); setIdx(n); }});
  const dup=id=>{ const s=LS.get(SK(id),null); if(!s) return; const c=clone(s); c.id=uid('s'); c.meta.title=s.meta.title+' (copy)'; c.updated=new Date().toISOString(); saveStudyLS(c); setIdx(LS.get(IDX,[])); };
  const onFile=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s||!s.maps||!s.meta) throw new Error('bad'); if(!s.id) s.id=uid('s'); open(s); }catch(err){ notify('That file is not a SHERPA Studio study (.sherpa.json)'); } }; r.readAsText(f); e.target.value=''; };
  return html`<div class="wrap" style="max-width:1100px;margin:0 auto;width:100%">
    <div class="page-head"><div><div class="eyebrow">risk2safe · Safety Critical Task Analysis</div><h2 style="font-size:30px">SHERPA Studio</h2>
      <p>Map how a task is really done, predict how each step could fail, rate the conditions that make failure likely, and agree the controls that make the right action easy. Exports to Word and Excel at every stage.</p></div></div>
    <div class="grid3" style="margin-bottom:22px">
      <div class="card"><h3>New study</h3><p class="muted small" style="margin:0">Start from a blank task map, or paste your procedure in stage 2.</p><div><button class="btn primary" onClick=${()=>open(newStudy())}>Start blank study</button></div></div>
      <div class="card"><h3>Example: road tanker offloading</h3><p class="muted small" style="margin:0">The webinar demo: 34-step procedure, work-as-done map, error modes, PIF ratings and a lighting improvement.</p><div><button class="btn" onClick=${()=>open(buildTanker())}>Open example</button></div></div>
      <div class="card"><h3>Example: console design review</h3><p class="muted small" style="margin:0">Design and verification requirements for checking status lights across three consoles.</p><div class="row"><button class="btn" onClick=${()=>open(buildConsole())}>Open example</button><button class="btn ghost" onClick=${()=>fileRef.current.click()}>Open study file…</button><input ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${onFile}/></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Studies in this browser</h3><span class="small faint">Kept in this browser only. Use "Save study file" to keep a copy elsewhere.</span></div>
      ${idx.length? html`<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl"><thead><tr><th>Study</th><th>Type</th><th>Last changed</th><th></th></tr></thead><tbody>
        ${idx.map(x=>html`<tr key=${x.id}><td><button class="btn ghost" style="padding:2px 0;font-weight:600" onClick=${()=>openId(x.id)}>${x.title||'Untitled study'}</button>${x.example?html` <span class="pill sig">example</span>`:null}</td><td class="small">${x.type}</td><td class="small mono">${(x.updated||'').slice(0,16).replace('T',' ')}</td>
          <td style="text-align:right;white-space:nowrap"><button class="btn sm" onClick=${()=>openId(x.id)}>Open</button> <button class="btn sm ghost" onClick=${()=>dup(x.id)}>Duplicate</button> <button class="btn sm ghost danger" onClick=${()=>del(x.id)}>Delete</button></td></tr>`)}
      </tbody></table></div>` : html`<div class="empty">No saved studies yet. Open an example to see the full workflow, or start a blank study.</div>`}
    </div>
    <div class="grid2" style="margin-top:22px">
      ${[['1–3','Map the task','Paste the procedure (work as imagined), rebuild it with the operators as work as done, and review every difference.'],
         ['4–5','Predict errors','Screen steps High, Medium or Low. For the risky ones, choose how each step could fail: check omitted, wrong object, monitoring interrupted.'],
         ['6','Assess PIFs','Rate the conditions behind each error on a five-point scale, from best case to worst case, with a reason.'],
         ['7–8','Improve controls','Act on the worst-rated PIFs with the strongest practical control, then export the risk-informed procedure, competence sheet and report.']].map(([n,t,d])=>html`<div class="row" style="align-items:flex-start;flex-wrap:nowrap" key=${n}><span class="code" style="margin-top:3px">${n}</span><div><b>${t}</b><div class="muted small">${d}</div></div></div>`)}
    </div>
  </div>`;
}

/* ===================== Stage 1: Set up ===================== */
function Setup({st,update}){
  const m=st.meta; const set=(k,v)=>update(s=>{s.meta[k]=v;});
  return html`<div class="split">
    <div class="panel"><div class="panel-h"><h3>Study details</h3></div><div class="panel-b">
      <div class="grid2"><${Field} label="Study title"><${Txt} id="m-title" value=${m.title} onChange=${v=>set('title',v)}/><//>
        <${Field} label="Study type"><select id="m-type" value=${m.studyType} onChange=${e=>set('studyType',e.target.value)}>${STUDY_TYPES.map(t=>html`<option key=${t}>${t}</option>`)}</select><//></div>
      <${Field} label="Task goal" hint="what the task achieves, e.g. Offload from road tanker"><${Txt} id="m-goal" value=${m.goal} onChange=${v=>update(s=>{s.meta.goal=v; [s.maps.wad,s.maps.wai].forEach(mp=>{ const r=mp.nodes[mp.rootId]; if(!r.label||r.label==='Insert overall task goal'||r.label===m.goal) r.label=v; });})}/><//>
      <div class="grid3"><${Field} label="Site"><${Txt} id="m-site" value=${m.site} onChange=${v=>set('site',v)}/><//><${Field} label="Facility / unit"><${Txt} id="m-fac" value=${m.facility} onChange=${v=>set('facility',v)}/><//><${Field} label="Revision"><${Txt} id="m-rev" value=${m.revision} onChange=${v=>set('revision',v)}/><//></div>
      <div class="grid2"><${Field} label="Study date"><input id="m-date" type="date" value=${m.date} onInput=${e=>set('date',e.target.value)}/><//><${Field} label="Study lead"><${Txt} id="m-owner" value=${m.owner} onChange=${v=>set('owner',v)}/><//></div>
      <${Field} label="Team members"><${Txt} id="m-team" rows="2" value=${m.team} onChange=${v=>set('team',v)}/><//>
      <${Field} label="Who described work as done" hint="names or roles, date and method (walk-through, talk-through, observation)"><${Txt} id="m-int" rows="2" value=${m.interviewees} onChange=${v=>set('interviewees',v)}/><//>
      <${Field} label="Preconditions" hint="equipment, personnel and plant state before the task starts"><${Txt} id="m-pre" rows="5" value=${m.preconditions} onChange=${v=>set('preconditions',v)}/><//>
      <${Field} label="Notes"><${Txt} id="m-notes" rows="3" value=${m.notes} onChange=${v=>set('notes',v)}/><//>
    </div></div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel"><div class="panel-h"><h3>Agents / persons</h3><button class="btn sm" onClick=${()=>update(s=>{s.agents.push({id:uid('a'),name:'',abbr:'',color:PALETTE[s.agents.length%PALETTE.length]});})}>Add role</button></div><div class="panel-b">
        <p class="small muted" style="margin:0">The roles that carry out steps. They colour the task map and fill the Role column of the procedure.</p>
        ${st.agents.map((a,i)=>html`<div class="row" key=${a.id} style="flex-wrap:nowrap"><span class="swatch" style=${{background:a.color,width:14,height:14}}></span>
          <input type="text" id=${'ag-n-'+a.id} placeholder="Role name" value=${a.name} onInput=${e=>update(s=>{s.agents[i].name=e.target.value;})}/>
          <input type="text" id=${'ag-a-'+a.id} placeholder="Abbr." style="max-width:90px" value=${a.abbr} onInput=${e=>update(s=>{s.agents[i].abbr=e.target.value;})}/>
          <select id=${'ag-c-'+a.id} style="max-width:84px" value=${a.color} onChange=${e=>update(s=>{s.agents[i].color=e.target.value;})}>${PALETTE.map((c,j)=>html`<option key=${c} value=${c}>Colour ${j+1}</option>`)}</select>
          <button class="btn sm ghost danger" aria-label="Remove role" onClick=${()=>update(s=>{s.agents.splice(i,1); Object.values(s.maps.wad.nodes).concat(Object.values(s.maps.wai.nodes)).forEach(n=>{n.agents=n.agents.filter(x=>x!==a.id);});})}>✕</button></div>`)}
        ${!st.agents.length?html`<div class="small faint">No roles yet.</div>`:null}
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Locations (Where)</h3><button class="btn sm" onClick=${()=>update(s=>{s.locations.push({id:uid('l'),name:'',color:PALETTE[(s.locations.length+3)%PALETTE.length]});})}>Add location</button></div><div class="panel-b">
        ${st.locations.map((l,i)=>html`<div class="row" key=${l.id} style="flex-wrap:nowrap"><span class="swatch" style=${{background:l.color,width:14,height:14}}></span>
          <input type="text" id=${'lo-n-'+l.id} placeholder="Location, e.g. Console A" value=${l.name} onInput=${e=>update(s=>{s.locations[i].name=e.target.value;})}/>
          <select id=${'lo-c-'+l.id} style="max-width:84px" value=${l.color} onChange=${e=>update(s=>{s.locations[i].color=e.target.value;})}>${PALETTE.map((c,j)=>html`<option key=${c} value=${c}>Colour ${j+1}</option>`)}</select>
          <button class="btn sm ghost danger" aria-label="Remove location" onClick=${()=>update(s=>{s.locations.splice(i,1);})}>✕</button></div>`)}
        ${!st.locations.length?html`<div class="small faint">Optional. Used for colouring the map by location.</div>`:null}
      </div></div>
      <div class="panel"><div class="panel-h"><h3>PIF rating mode</h3></div><div class="panel-b">
        <div class="seg"><button aria-pressed=${m.ratingMode!=='enhanced'} onClick=${()=>set('ratingMode','simple')}>Simple (equal weights)</button><button aria-pressed=${m.ratingMode==='enhanced'} onClick=${()=>set('ratingMode','enhanced')}>Enhanced (weights 1–3)</button></div>
        <p class="small muted" style="margin:0">The error-mode score is the mean of its PIF ratings. Enhanced mode lets you weight the PIFs that matter most for a step.</p>
      </div></div>
    </div></div>`;
}

/* ===================== Stage 2: Task map ===================== */
function parsePaste(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  let rows=lines.map(l=>l.split('\t').map(c=>c.trim()));
  const maxc=Math.max(0,...rows.map(r=>r.length));
  if(maxc<=1){ rows=lines.map(l=>{ const m=l.trim().match(/^(\d+(?:\.\d+)*)[\.\)]?\s+(.*)$/); return m?[m[1],m[2]]:['',l.trim()]; }); }
  return rows;
}
function ImportPanel({st,update,notify,ask,onDone}){
  const [text,setText]=useState(''); const [map,setMap]=useState(null);
  const rows=useMemo(()=>parsePaste(text),[text]); const ncol=Math.max(0,...rows.map(r=>r.length));
  useEffect(()=>{ if(!rows.length){ setMap(null); return; } if(ncol>=4) setMap({group:0,step:1,text:2,role:3}); else if(ncol===3) setMap({group:0,step:1,text:2,role:-1}); else if(ncol===2) setMap({group:-1,step:0,text:1,role:-1}); else setMap({group:-1,step:-1,text:0,role:-1}); },[ncol]);
  const fileRef=useRef(null);
  const onFile=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ if(/\.csv$|\.txt$/i.test(f.name)){ const t=await f.text(); setText(t.split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'')).join('\t')).join('\n')); return; }
      const X=await loadXlsx(); const wb=X.read(await f.arrayBuffer()); const ws=wb.Sheets[wb.SheetNames[0]]; const aoa=X.utils.sheet_to_json(ws,{header:1,blankrows:false}); setText(aoa.map(r=>r.map(c=>String(c??'')).join('\t')).join('\n')); }
    catch(err){ notify('Could not read that file. Copy the table from Word or Excel and paste it instead.'); } };
  const looksHeader = r => r && /step|description|action|role|task/i.test(r.join(' ')) && !/^\d/.test((r[map?.step]||'').trim());
  const body = map && rows.length && looksHeader(rows[0]) ? rows.slice(1) : rows;
  const build=()=>{ if(!map||!body.length) return;
    const go=()=>update(s=>{ const m=newMap(s.meta.goal||'Insert overall task goal'); m.source='Pasted procedure ('+body.length+' rows)'; m.capturedOn=today();
      let curGroup=null, curName=null;
      body.forEach(r=>{ const g = map.group>=0 ? (r[map.group]||'').replace(/^\s*\d+[\.\)]?\s*/,'').trim() : ''; const t=(r[map.text]||'').trim(); if(!t&&!g) return;
        if(map.group>=0 && g && g!==curName){ curGroup=addChild(m,m.rootId,g).id; curName=g; }
        if(!t) return; const parent=curGroup||m.rootId; let agents=[];
        if(map.role>=0 && r[map.role]){ const rn=r[map.role].trim(); let a=s.agents.find(x=>x.name.toLowerCase()===rn.toLowerCase()||x.abbr.toLowerCase()===rn.toLowerCase()); if(!a){ a={id:uid('a'),name:rn,abbr:rn.split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3),color:PALETTE[s.agents.length%PALETTE.length]}; s.agents.push(a);} agents=[a.id]; }
        const ref = map.step>=0 ? (r[map.step]||'').replace(/\.$/,'') : ''; addChild(m,parent,t,null,{ref:ref?ref+'.':'',agents}); });
      s.maps.wai=m; });
    if(leavesOf(st.maps.wai).length) ask({title:'Replace the work-as-imagined map?',body:'The current work-as-imagined map will be replaced by the pasted procedure. Links from the work-as-done map to old steps will be lost.',okLabel:'Replace',ok:()=>{go(); onDone();}});
    else { go(); onDone(); } };
  const colSel=(k,label,opt)=>html`<${Field} label=${label}><select id=${'imp-'+k} value=${map?map[k]:-1} onChange=${e=>setMap(Object.assign({},map,{[k]:+e.target.value}))}>${opt?html`<option value="-1">— none —</option>`:null}${Array.from({length:ncol},(_,i)=>html`<option key=${i} value=${i}>Column ${i+1}${rows[0]&&rows[0][i]?': '+String(rows[0][i]).slice(0,24):''}</option>`)}</select><//>`;
  return html`<div class="panel"><div class="panel-h"><h3>Bring in the procedure (work as imagined)</h3><div class="row"><button class="btn sm" onClick=${()=>fileRef.current.click()}>Upload .xlsx / .csv</button><input ref=${fileRef} type="file" accept=".xlsx,.xls,.csv,.txt" hidden onChange=${onFile}/></div></div><div class="panel-b">
    <p class="small muted" style="margin:0">Copy the procedure table from Word or Excel and paste it here. Each row becomes a task box and keeps its step number, so you can trace work as done back to the procedure. A plain numbered list works too.</p>
    <textarea id="imp-text" rows="7" placeholder=${'Paste here, for example:\n1. Perform tanker arrival operations\t1.\tCheck tanker is expected on SAP system in control room\n\t2.\tPrint delivery checklist and begin completing relevant sections'} value=${text} onInput=${e=>setText(e.target.value)}></textarea>
    ${rows.length? html`<div class="grid2">${colSel('text','Step text column',false)}${colSel('step','Step number column',true)}${colSel('group','Task / section column',true)}${colSel('role','Role column',true)}</div>
      <div class="tbl-wrap" style="max-height:220px;overflow:auto"><table class="tbl"><thead><tr><th>Section</th><th>No.</th><th>Step</th><th>Role</th></tr></thead><tbody>${body.slice(0,40).map((r,i)=>html`<tr key=${i}><td class="small">${map&&map.group>=0?r[map.group]:''}</td><td class="num small">${map&&map.step>=0?r[map.step]:''}</td><td class="small">${map?r[map.text]:''}</td><td class="small">${map&&map.role>=0?r[map.role]:''}</td></tr>`)}</tbody></table></div>
      <div class="row"><button class="btn primary" onClick=${build}>Build work-as-imagined map from ${body.length} rows</button><span class="small faint">Header row skipped automatically when detected.</span></div>`:null}
  </div></div>`;
}

        <button class="tw" aria-label=${hasK?(collapsed[n.id]?'Expand':'Collapse'):''} onClick=${e=>{e.stopPropagation(); if(hasK) setCollapsed(c=>Object.assign({},c,{[n.id]:!c[n.id]}));}}>${hasK?(collapsed[n.id]?'▸':'▾'):''}</button>

/* ===================== Stage 3: Compare ===================== */

/* ===================== Stage 4: Screen ===================== */

/* ===================== Stage 5: Errors ===================== */
function newAnalysis(nodeId,mode){ return {id:uid('e'),nodeId,mode,errorDesc:'',errorType:'',consequence:'',consTypes:[],controls:'',recovery:'',credible:true,notCredibleReason:'',notes:'',designReq:'',verifReq:'',pifNotes:'',pifs:[],improvements:[]}; }

function Errors({st,update,ask,notify,ui,setUi}){

  const cur=ui.errStep&&wad.nodes[ui.errStep]?ui.errStep:items[0]?.id; const n=wad.nodes[cur];

  const ans=st.analyses.filter(a=>a.nodeId===cur);
  const design = st.meta.studyType==='Design review' || ans.some(a=>a.designReq||a.verifReq) || ui.showDesign;
  const toggleMode=code=>{ const ex=ans.find(a=>a.mode===code);
    if(ex){ const has=ex.errorDesc||ex.consequence||(ex.pifs||[]).length; const go=()=>update(s=>{ s.analyses=s.analyses.filter(a=>a.id!==ex.id); }); if(has) ask({title:'Remove '+code+'?',body:'This error mode has details, PIF ratings or improvements. Removing it deletes them.',okLabel:'Remove',danger:true,ok:go}); else go(); }
    else update(s=>{ s.analyses.push(newAnalysis(cur,code)); }); };
  const setA=(id,k,v)=>update(s=>{ const a=s.analyses.find(x=>x.id===id); if(a) a[k]=v; });
  const suggest=async()=>{ if(!sample||!n) return; setBusy(true); setSugg(null);
    try{ const parent=wad.nodes[n.parent]; const modes=ERROR_MODES.filter(m=>!n.activity||m.a===n.activity);
      const prompt=`You are a human factors specialist running a SHERPA (Systematic Human Error Reduction and Prediction Approach) analysis.\nTask goal: ${wad.nodes[wad.rootId].label}\nParent task: ${parent?.label||''}\nStep ${nums[n.id]}: ${n.label}\nPerformed by: ${agentNames(st,n.agents)||'unknown'}\nActivity type: ${n.activity||'not set'}\nWarnings/comments: ${n.warnings||''} ${n.comments||''}\nChoose the credible error modes for this step ONLY from this list (code: name): ${modes.map(m=>m.code+': '+m.name).join('; ')}.\nReturn JSON {"modes":[{"code":"...","errorDesc":"short description of the error in plain words","consequence":"what could happen","errorType":"Slip|Lapse|Mistake|Non-compliance"}]} with at most 4 entries, most credible first.`;
      const r=await sample.json(prompt,{modelTier:'default'}); const list=(r&&r.modes||[]).filter(x=>modeOf(x.code)); setSugg(list); if(!list.length) notify('No suggestions came back'); }
    catch(e){ notify(e&&e.code==='not_granted'?'AI suggestions were not allowed in this view':'AI suggestions are not available right now'); }
    setBusy(false); };
  const addSugg=x=>{ if(ans.find(a=>a.mode===x.code)) return; update(s=>{ const a=newAnalysis(cur,x.code); a.errorDesc=x.errorDesc||''; a.consequence=x.consequence||''; a.errorType=ERROR_TYPES.some(t=>t.v===x.errorType)?x.errorType:''; a.notes='AI-proposed: review before relying on it'; s.analyses.push(a); if(!s.maps.wad.nodes[cur].activity) s.maps.wad.nodes[cur].activity=modeOf(x.code).a; }); };
  return html`<div class="split list-left">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><label class="row small"><input type="checkbox" checked=${showLow} onChange=${e=>setShowLow(e.target.checked)}/> Include Low and unscreened steps</label>
      <${StepList} st=${st} items=${items} cur=${cur} setCur=${id=>{setUi({errStep:id}); setSugg(null);}} extra=${x=>{ const k=st.analyses.filter(a=>a.nodeId===x.id).length; return html`<span class="row" style="gap:4px;flex-wrap:nowrap">${k?html`<span class="code">${k}</span>`:null}<${RiskPill} r=${x.risk}/></span>`; }}/></div>
    ${!n?html`<div class="panel"><div class="empty">No Medium or High steps yet. Screen the steps in stage 4, or include Low steps.</div></div>`:html`<div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="panel"><div class="panel-h"><div><div class="eyebrow">Step ${nums[n.id]} · ${agentLabel(st,n.agents)||'no role'}</div><h3>${n.label}</h3></div><${RiskPill} r=${n.risk}/></div>
        <div class="panel-b">
          ${n.warnings?html`<div class="notice small"><b>Warning on this step:</b> ${n.warnings}</div>`:null}
          <div class="row"><${Field} label="Activity type" style=${{minWidth:'220px'}}><select id="er-act" value=${n.activity} onChange=${e=>update(s=>{s.maps.wad.nodes[cur].activity=e.target.value;})}><option value="">— choose what the person is doing —</option>${ACTIVITY_TYPES.map(a=>html`<option key=${a.code} value=${a.code}>${a.name} — ${a.desc}</option>`)}</select><//>
            ${sample?html`<button class="btn" style="align-self:end" disabled=${busy} onClick=${suggest}>${busy?'Asking Claude…':'Suggest error modes'}</button>`:null}</div>
          ${sugg&&sugg.length?html`<div class="card"><div class="card-h"><b>Suggested error modes</b><span class="pill acc">AI-proposed</span><span class="small faint">Review each before adding.</span></div>
            ${sugg.map(x=>html`<div key=${x.code} class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="code">${x.code}</span><div class="grow small"><b>${modeOf(x.code).name}</b> — ${x.errorDesc}<div class="faint">${x.consequence}</div></div><button class="btn sm" disabled=${!!ans.find(a=>a.mode===x.code)} onClick=${()=>addSugg(x)}>${ans.find(a=>a.mode===x.code)?'Added':'Add'}</button></div>`)}</div>`:null}
          ${n.activity?html`<div><div class="eyebrow" style="margin-bottom:6px">How could this step go wrong? Tick each credible error mode</div>
            <div style="display:flex;flex-direction:column;gap:2px">${ERROR_MODES.filter(m=>m.a===n.activity).map(m=>{ const on=!!ans.find(a=>a.mode===m.code);
              return html`<label key=${m.code} class="row" style="align-items:flex-start;flex-wrap:nowrap;padding:5px 6px;border-radius:5px;background:${on?'var(--accent-soft)':'transparent'};cursor:pointer"><input type="checkbox" checked=${on} onChange=${()=>toggleMode(m.code)} style="margin-top:3px"/><span class="code">${m.code}</span><span class="small"><b>${m.name}</b>${!m.demo?html` <span class="faint">(assumed code)</span>`:null}<br/><span class="muted">${m.q}</span></span></label>`; })}</div></div>`
            :html`<div class="notice info small">Choose the activity type first. It decides which error modes apply.</div>`}
          ${!ans.length?html`<label class="row small" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" checked=${!!n.noneCredible} onChange=${e=>update(s=>{s.maps.wad.nodes[cur].noneCredible=e.target.checked;})}/> <span>No credible error mode for this step${n.noneCredible?html`<input type="text" id="er-none" placeholder="Reason, e.g. interlock prevents the step being skipped" value=${n.noneReason||''} onInput=${e=>update(s=>{s.maps.wad.nodes[cur].noneReason=e.target.value;})} style="margin-top:4px"/>`:null}</span></label>`:null}
        </div></div>
      ${ans.map(a=>{ const m=modeOf(a.mode)||{name:a.mode};
        return html`<div class="card" key=${a.id}><div class="card-h"><span class="code">${a.mode}</span><b>${m.name}</b><span class="grow"></span>
            <label class="row small" style="gap:4px"><input type="checkbox" checked=${a.credible} onChange=${e=>setA(a.id,'credible',e.target.checked)}/> Credible</label></div>
          ${!a.credible?html`<${Field} label="Why it is not credible"><${Txt} id=${'nc-'+a.id} value=${a.notCredibleReason} onChange=${v=>setA(a.id,'notCredibleReason',v)}/><//>`:html`
          <div class="grid2"><${Field} label="Error description" hint="what the person does wrong"><${Txt} id=${'ed-'+a.id} rows="2" value=${a.errorDesc} onChange=${v=>setA(a.id,'errorDesc',v)}/><//>
            <${Field} label="Consequences"><${Txt} id=${'co-'+a.id} rows="2" value=${a.consequence} onChange=${v=>setA(a.id,'consequence',v)}/><//></div>
          <${Field} label="Error type"><div class="seg" role="group">${ERROR_TYPES.map(t=>html`<button key=${t.v} aria-pressed=${a.errorType===t.v} title=${t.d} onClick=${()=>setA(a.id,'errorType',a.errorType===t.v?'':t.v)}>${t.v}</button>`)}</div>${a.errorType?html`<span class="hint">${ERROR_TYPES.find(t=>t.v===a.errorType).d}</span>`:null}<//>
          <${Field} label="Consequence type"><div class="chips">${CONSEQUENCE_TYPES.map(c=>html`<button key=${c} class="chip" aria-pressed=${(a.consTypes||[]).includes(c)} onClick=${()=>setA(a.id,'consTypes',(a.consTypes||[]).includes(c)?a.consTypes.filter(x=>x!==c):(a.consTypes||[]).concat([c]))}>${c}</button>`)}</div><//>
          <div class="grid2"><${Field} label="Existing risk control measures"><${Txt} id=${'ec-'+a.id} rows="2" value=${a.controls} onChange=${v=>setA(a.id,'controls',v)} placeholder="e.g. Alarm, bund, ESD"/><//>
            <${Field} label="Recovery" hint="how the error would be noticed and put right"><${Txt} id=${'rc-'+a.id} rows="2" value=${a.recovery} onChange=${v=>setA(a.id,'recovery',v)}/><//></div>
          ${design?html`<div class="grid2"><${Field} label="Design requirement"><${Txt} id=${'dr-'+a.id} rows="2" value=${a.designReq} onChange=${v=>setA(a.id,'designReq',v)}/><//><${Field} label="Verification / validation requirement"><${Txt} id=${'vr-'+a.id} rows="2" value=${a.verifReq} onChange=${v=>setA(a.id,'verifReq',v)}/><//></div>`:null}
          <${Field} label="Analyst notes"><${Txt} id=${'an-'+a.id} value=${a.notes} onChange=${v=>setA(a.id,'notes',v)}/><//>`}
        </div>`; })}
      ${ans.length&&!design?html`<div><button class="btn sm ghost" onClick=${()=>setUi({showDesign:true})}>Show design and verification requirement fields</button></div>`:null}
    </div>`}
  </div>`;
}

/* ===================== Stage 6: PIFs ===================== */
function Scale({value,onChange,small}){ return html`<div class="scale" role="group" aria-label="Rating">${RATING.map(r=>html`<button key=${r.v} data-v=${r.v} aria-pressed=${value===r.v} onClick=${()=>onChange(r.v)} title=${r.h}><b>${r.v}</b>${small?null:html`${r.l}<br/><span class="faint">${r.h}</span>`}</button>`)}</div>`; }
function credibleList(st){ const wad=st.maps.wad; const ord=Object.fromEntries(leavesOf(wad).map((n,i)=>[n.id,i])); return st.analyses.filter(a=>a.credible&&wad.nodes[a.nodeId]).sort((a,b)=>(ord[a.nodeId]-ord[b.nodeId])||a.mode.localeCompare(b.mode)); }
function AnList({st,list,cur,setCur,right}){
  const nums=numbering(st.maps.wad);
  return html`<div class="panel"><div class="list">${list.map(a=>{ const n=st.maps.wad.nodes[a.nodeId]; return html`<button key=${a.id} class="li" aria-current=${a.id===cur} onClick=${()=>setCur(a.id)}><span class="n">${nums[n.id]}</span><span class="small"><span class="code">${a.mode}</span> ${modeOf(a.mode)?.name||''}<br/><span class="faint">${n.label.slice(0,70)}</span></span><span>${right(a,n)}</span></button>`; })}
    ${!list.length?html`<div class="empty small">No credible error modes yet. Add them in stage 5.</div>`:null}</div></div>`;
}
function Pifs({st,update,ui,setUi}){
  const list=credibleList(st); const mode=st.meta.ratingMode; const [showAll,setShowAll]=useState(false); const [custom,setCustom]=useState({name:'',st:''});
  const cur=ui.pifAn&&list.find(a=>a.id===ui.pifAn)?ui.pifAn:list[0]?.id; const a=list.find(x=>x.id===cur);
  const nums=numbering(st.maps.wad);
  const upd=fn=>update(s=>{ const x=s.analyses.find(y=>y.id===cur); if(x) fn(x); });
  if(!a) return html`<${AnList} st=${st} list=${list} cur=${cur} setCur=${()=>{}} right=${()=>null}/>`;
  const n=st.maps.wad.nodes[a.nodeId]; const act=modeOf(a.mode)?.a; const attached=new Set(a.pifs.map(p=>p.pifId));
  const avail=PIFS.filter(p=>showAll||p.a.includes(act));
  const togglePif=p=>upd(x=>{ if(x.pifs.find(q=>q.pifId===p.id)) x.pifs=x.pifs.filter(q=>q.pifId!==p.id); else x.pifs.push({id:uid('p'),pifId:p.id,name:p.name,statement:p.st,baseline:50,modified:null,reason:'',weight:1}); });
  const b=anScore(a,'baseline',mode);
  return html`<div class="split list-left">
    <${AnList} st=${st} list=${list} cur=${cur} setCur=${id=>setUi({pifAn:id})} right=${x=>html`<${Meter} v=${anScore(x,'baseline',mode)}/>`}/>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="panel"><div class="panel-h"><div><div class="eyebrow">Step ${nums[n.id]} · ${n.label.slice(0,90)}</div><h3><span class="code">${a.mode}</span> ${modeOf(a.mode)?.name}</h3></div><div class="row"><span class="small muted">Error-mode score</span><${Meter} v=${b}/></div></div>
        <div class="panel-b">
          ${a.errorDesc?html`<div class="small"><b>Error:</b> ${a.errorDesc}${a.consequence?html` · <b>Consequence:</b> ${a.consequence}`:null}</div>`:null}
          <${Field} label="Why could this error happen here?" hint="free notes from the discussion, e.g. –ve Proximity: ESD is located nearby"><${Txt} id="pf-notes" rows="2" value=${a.pifNotes} onChange=${v=>upd(x=>{x.pifNotes=v;})}/><//>
          <div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="eyebrow">Choose the PIFs that apply</span><label class="row small"><input type="checkbox" checked=${showAll} onChange=${e=>setShowAll(e.target.checked)}/> Show all PIFs</label></div>
            <div class="chips">${avail.map(p=>html`<button key=${p.id} class="chip" aria-pressed=${attached.has(p.id)} onClick=${()=>togglePif(p)} title=${p.st}>${p.name}</button>`)}</div></div>
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="pf-cn" placeholder="Own PIF name" value=${custom.name} onInput=${e=>setCustom(Object.assign({},custom,{name:e.target.value}))} style="max-width:200px"/><input type="text" id="pf-cs" placeholder="Statement, written as the adverse condition" value=${custom.st} onInput=${e=>setCustom(Object.assign({},custom,{st:e.target.value}))}/>
            <button class="btn sm" disabled=${!custom.name.trim()} onClick=${()=>{ upd(x=>{ x.pifs.push({id:uid('p'),pifId:'custom',name:custom.name.trim(),statement:custom.st.trim()||custom.name.trim(),baseline:50,modified:null,reason:'',weight:1}); }); setCustom({name:'',st:''}); }}>Add</button></div>
        </div></div>
      ${a.pifs.map((p,i)=>{ const lib=PIF[p.pifId]; const setP=(k,v)=>upd(x=>{ x.pifs[i][k]=v; });
        return html`<div key=${p.id} class=${'card'+(p.baseline>=75?' flag':'')}>
          <div class="card-h"><b>${p.name}</b>${p.baseline>=75?html`<span class="pill sig">flagged for improvement</span>`:null}<span class="grow"></span>
            ${mode==='enhanced'?html`<label class="row small" style="gap:4px">Weight <select id=${'pw-'+p.id} style="width:auto" value=${p.weight||1} onChange=${e=>setP('weight',+e.target.value)}><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>`:null}
            <button class="btn sm ghost danger" onClick=${()=>upd(x=>{x.pifs.splice(i,1);})}>Remove</button></div>
          <${Field} label="Statement" hint="agree = worse"><${Txt} id=${'ps-'+p.id} value=${p.statement} onChange=${v=>setP('statement',v)}/><//>
          <${Scale} value=${p.baseline} onChange=${v=>setP('baseline',v)}/>
          ${lib?html`<details><summary class="small muted" style="cursor:pointer">Guidance</summary><p class="small muted" style="margin:6px 0 0">${lib.g}</p></details>`:null}
          <${Field} label=${'Reason for rating'+(p.baseline!==50?' (required)':'')}><${Txt} id=${'pr-'+p.id} value=${p.reason} onChange=${v=>setP('reason',v)} placeholder=${p.baseline!==50?'What did the team see or hear that supports this rating?':'Optional at industry norm'}/><//>
        </div>`; })}
      ${!a.pifs.length?html`<div class="notice info small">Pick at least three PIFs above, then rate each statement. Start with the conditions the operators mentioned.</div>`:null}
    </div></div>`;
}

/* ===================== Stage 7: Controls ===================== */
function Controls({st,update,notify,ui,setUi}){
  const mode=st.meta.ratingMode; const nums=numbering(st.maps.wad); const sample=useCap('sample'); const [busy,setBusy]=useState(false); const [sugg,setSugg]=useState(null);
  const all=credibleList(st); const list=all.filter(a=>flaggedPifs(a).length||(a.improvements||[]).length).sort((x,y)=>(priorityOf(x,st.maps.wad.nodes[x.nodeId],mode)||9)-(priorityOf(y,st.maps.wad.nodes[y.nodeId],mode)||9));
  const cur=ui.ctlAn&&list.find(a=>a.id===ui.ctlAn)?ui.ctlAn:list[0]?.id; const a=list.find(x=>x.id===cur);
  const imps=all.flatMap(x=>(x.improvements||[]).map(i=>({i,a:x}))); const byStatus=s=>imps.filter(x=>x.i.status===s).length;
  const pri=k=>all.filter(x=>priorityOf(x,st.maps.wad.nodes[x.nodeId],mode)===k).length;
  const upd=fn=>update(s=>{ const x=s.analyses.find(y=>y.id===cur); if(x) fn(x); });
  const addImp=(text,level,pifIds,source,status)=>upd(x=>{ x.improvements=x.improvements||[]; x.improvements.push({id:uid('i'),text,level,pifIds,owner:'',due:'',status:status||'Accepted',verification:'',source}); });
  const kpis=html`<div class="kpis"><div class="kpi"><b style="color:var(--hi)">${pri(1)}</b><span>Priority 1</span></div><div class="kpi"><b style="color:var(--med)">${pri(2)}</b><span>Priority 2</span></div><div class="kpi"><b>${pri(3)}</b><span>Priority 3</span></div>
    <div class="kpi"><b>${byStatus('Proposed')+byStatus('Accepted')}</b><span>Open improvements</span></div><div class="kpi"><b>${byStatus('Done')+byStatus('Verified')}</b><span>Done or verified</span></div></div>`;
  if(!a) return html`<div style="display:flex;flex-direction:column;gap:14px">${kpis}<div class="panel"><div class="empty">No PIFs are rated 75 or 100 yet, so there is nothing flagged for improvement. Rate PIFs in stage 6.</div></div></div>`;
  const n=st.maps.wad.nodes[a.nodeId]; const fl=flaggedPifs(a); const p=priorityOf(a,n,mode);
  const suggest=async()=>{ if(!sample) return; setBusy(true); setSugg(null);
    try{ const prompt=`You are a human factors specialist recommending controls in a SHERPA study (high-hazard industry).\nTask: ${st.maps.wad.nodes[st.maps.wad.rootId].label}\nStep ${nums[n.id]}: ${n.label}\nError mode ${a.mode} ${modeOf(a.mode)?.name}: ${a.errorDesc}\nConsequence: ${a.consequence}\nExisting controls: ${a.controls||'none recorded'}\nPIFs rated worse than industry norm: ${fl.map(q=>`[${q.id}] ${q.name}: "${q.statement}" rated ${q.baseline}/100 because ${q.reason||'n/a'}`).join('; ')}\nPropose up to 5 specific, practical improvements that make correct performance easier, strongest control type first. Control level must be one of ${CONTROL_LEVELS.map(l=>l.k+'='+l.name).join(', ')}.\nReturn JSON {"improvements":[{"text":"...","level":"ENG","pifId":"<id in brackets above>"}]}.`;
      const r=await sample.json(prompt,{modelTier:'default'}); const out=(r&&r.improvements||[]).filter(x=>x.text&&LEVEL[x.level]); setSugg(out); if(!out.length) notify('No suggestions came back'); }
    catch(e){ notify(e&&e.code==='not_granted'?'AI suggestions were not allowed in this view':'AI suggestions are not available right now'); }
    setBusy(false); };
  return html`<div style="display:flex;flex-direction:column;gap:14px">${kpis}
    <div class="split list-left">
      <${AnList} st=${st} list=${list} cur=${cur} setCur=${id=>{setUi({ctlAn:id}); setSugg(null);}} right=${(x,nn)=>html`<${PriPill} p=${priorityOf(x,nn,mode)}/>`}/>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="panel"><div class="panel-h"><div><div class="eyebrow">Step ${nums[n.id]} · ${riskName(n.risk)} risk</div><h3><span class="code">${a.mode}</span> ${modeOf(a.mode)?.name}</h3></div>
          <div class="row"><${PriPill} p=${p}/><span class="small muted">Baseline</span><${Meter} v=${anScore(a,'baseline',mode)}/><span class="small muted">Modified</span><${Meter} v=${anScore(a,'modified',mode)}/></div></div>
          <div class="panel-b"><div class="small">${a.errorDesc?html`<b>Error:</b> ${a.errorDesc}. `:null}${a.consequence?html`<b>Consequence:</b> ${a.consequence}. `:null}${a.controls?html`<b>Existing controls:</b> ${a.controls.replace(/\n/g,', ')}`:null}</div>
            ${sample?html`<div><button class="btn" disabled=${busy} onClick=${suggest}>${busy?'Asking Claude…':'Suggest improvements'}</button></div>`:null}
            ${sugg&&sugg.length?html`<div class="card"><div class="card-h"><b>Suggested improvements</b><span class="pill acc">AI-proposed</span></div>${sugg.map((x,i)=>{ const pp=a.pifs.find(q=>q.id===x.pifId); return html`<div key=${i} class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="pill acc">${LEVEL[x.level].name}</span><span class="grow small">${x.text}${pp?html` <span class="faint">(${pp.name})</span>`:null}</span><button class="btn sm" onClick=${()=>addImp(x.text,x.level,pp?[pp.id]:[],'AI-proposed','Proposed')}>Add</button></div>`; })}</div>`:null}
          </div></div>
        ${fl.map(q=>{ const lib=PIF[q.pifId]; const tmpl=(lib?lib.c:[]).slice().sort((x,y)=>LEVEL[x[0]].rank-LEVEL[y[0]].rank); const has=(a.improvements||[]).filter(i=>(i.pifIds||[]).includes(q.id)&&i.status!=='Rejected');
          const existing = a.controls && lib && tmpl.some(([,t])=>a.controls.toLowerCase().split(/\W+/).some(w=>w.length>3&&t.toLowerCase().includes(w)));
          return html`<div class="card flag" key=${q.id}><div class="card-h"><b>${q.name}</b><span class="pill hi">${q.baseline}</span><span class="small muted">"${q.statement}"</span></div>
            ${q.reason?html`<div class="small faint">Reason: ${q.reason}</div>`:null}
            ${existing?html`<div class="notice info small">An existing control may already address this PIF. Confirm it works before adding a new one.</div>`:null}
            <div class="eyebrow">Controls to consider, strongest first</div>
            ${tmpl.map(([lv,t],i)=>{ const added=(a.improvements||[]).some(x=>x.text===t); return html`<div key=${i} class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="pill acc" style="min-width:150px;justify-content:center">${LEVEL[lv].name}</span><span class="grow small">${t}</span><button class="btn sm" disabled=${added} onClick=${()=>addImp(t,lv,[q.id],'Library')}>${added?'Added':'Add'}</button></div>`; })}
            ${!has.length?html`<${Field} label="Or record why no improvement is needed"><input type="text" id=${'nr-'+q.id} value=${q.noControlReason||''} onInput=${e=>upd(x=>{ const y=x.pifs.find(z=>z.id===q.id); y.noControlReason=e.target.value; })}/><//>`:null}
          </div>`; })}
        <div class="panel"><div class="panel-h"><h3>Agreed improvements</h3><button class="btn sm" onClick=${()=>addImp('','PROC',[], 'Analyst')}>Add own improvement</button></div><div class="panel-b">
          ${(a.improvements||[]).map((im,i)=>{ const setI=(k,v)=>upd(x=>{ x.improvements[i][k]=v; });
            return html`<div key=${im.id} class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><textarea id=${'it-'+im.id} rows="2" value=${im.text} placeholder="Describe the improvement" onInput=${e=>setI('text',e.target.value)}></textarea><button class="btn sm ghost danger" onClick=${()=>upd(x=>{x.improvements.splice(i,1);})} aria-label="Remove improvement">✕</button></div>
              <div class="grid3"><${Field} label="Control level"><select id=${'il-'+im.id} value=${im.level} onChange=${e=>setI('level',e.target.value)}>${CONTROL_LEVELS.map(l=>html`<option key=${l.k} value=${l.k}>${l.name}</option>`)}</select><//>
                <${Field} label="Owner"><input type="text" id=${'io-'+im.id} value=${im.owner} onInput=${e=>setI('owner',e.target.value)}/><//><${Field} label="Due date"><input type="date" id=${'id-'+im.id} value=${im.due} onInput=${e=>setI('due',e.target.value)}/><//></div>

function procedureModel(st,opt){
  const wad=st.maps.wad; const nums=numbering(wad); const root=wad.nodes[wad.rootId];
  const anBy={}; st.analyses.filter(a=>a.credible).forEach(a=>{ (anBy[a.nodeId]=anBy[a.nodeId]||[]).push(a); });
  const sections=root.children.map(tid=>{ const t=wad.nodes[tid]; const rows=[];
    const go=(id,d)=>{ const n=wad.nodes[id]; const com=[]; if(n.comments) com.push(n.comments);
      if(opt.errors) (anBy[id]||[]).forEach(a=>{ if(a.errorDesc||a.consequence) com.push(`${a.mode}: ${a.errorDesc||''}${a.consequence?' → '+a.consequence:''}`); });
      if(opt.improvements) (anBy[id]||[]).forEach(a=>(a.improvements||[]).filter(i=>i.status!=='Rejected'&&['PROC','SUP'].includes(i.level)&&i.text).forEach(i=>com.push('Control: '+i.text)));
      rows.push({id,num:nums[id],label:n.label,depth:d,role:agentNames(st,n.agents),abbr:agentLabel(st,n.agents),comments:com,warning:opt.warnings?n.warnings:'',crit:opt.highlight&&(n.critical||n.risk===3),photos:opt.photos?(n.photos||[]):[],plan:n.children.length?(n.plan.type==='cond'?n.plan.text:''):''});
      n.children.forEach(c=>go(c,d+1)); };
    if(t.children.length) t.children.forEach(c=>go(c,0)); else go(tid,0);
    return {num:nums[tid],label:t.label,plan:t.children.length&&t.plan.type==='cond'?t.plan.text:'',rows}; });
  return {title:root.label||st.meta.goal,revision:st.meta.revision,date:st.meta.date,site:[st.meta.site,st.meta.facility].filter(Boolean).join(' · '),preconditions:st.meta.preconditions,
    overview:root.children.map(id=>({num:nums[id],label:wad.nodes[id].label})),sections};
}
function competenceRows(st){

function actionRows(st){
