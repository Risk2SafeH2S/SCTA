<style>
:root{
  --navy:#16243F; --navy2:#2C3C5C; --grey:#6A768A; --line:#D6DCE5; --line2:#E9EDF2;
  --bg:#F3F6F9; --card:#FFFFFF;
  --blue:#1565C0; --blue-t:#E5EFFB;
  --green:#2E8B1E; --green-t:#E7F4E3;
  --red:#C8261E; --red-t:#FCE9E7;
  --amber:#B86E00; --amber-t:#FFF3DC;
  --teal:#0E7C86; --teal-t:#E2F3F4;
  --scope:var(--blue); --analyse:var(--teal); --act:var(--red); --learn:var(--green);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--navy);background:var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0 0 .7rem}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none !important}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:1rem;padding:.45rem 1.2rem;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.brand img{height:46px;width:auto;display:block}
.brand b{font-size:1.05rem;display:block}
.brand small{color:var(--grey);font-size:.75rem}
.top .grow{flex:1}
.study-name{font-size:.85rem;color:var(--grey);text-align:right;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-name b{color:var(--navy)}
.saved{font-size:.75rem;color:var(--green)}

/* flow bar */
.flow{background:#fff;border-bottom:1px solid var(--line)}
.flow-in{display:flex;gap:.6rem;padding:.55rem 1.2rem .7rem;max-width:1280px;margin:0 auto;overflow-x:auto}
.phase{flex:1 1 0;min-width:max-content}
.phase>span{display:block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;padding-left:.2rem}
.phase .chips{display:flex;gap:.3rem}
.chip{flex:1;display:flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.35rem .6rem;cursor:pointer;font-size:.85rem;white-space:nowrap;border-top:3px solid var(--pc)}
.chip i{font-style:normal;font-weight:700;width:1.35rem;height:1.35rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--pt);color:var(--pc);font-size:.78rem}
.chip.on{background:var(--pt);border-color:var(--pc);font-weight:600}
.chip.on i{background:var(--pc);color:#fff}
.chip.done i::after{content:"✓";font-size:.7rem;margin-left:1px}
.chip.done i span{display:none}
.ph-scope{--pc:var(--scope);--pt:var(--blue-t)} .ph-scope>span{color:var(--scope)}
.ph-analyse{--pc:var(--analyse);--pt:var(--teal-t)} .ph-analyse>span{color:var(--analyse)}
.ph-act{--pc:var(--act);--pt:var(--red-t)} .ph-act>span{color:var(--act)}
.ph-learn{--pc:var(--learn);--pt:var(--green-t)} .ph-learn>span{color:var(--learn)}
.chip.out{--pc:var(--navy2);--pt:var(--line2)}

/* page */
main{max-width:1280px;margin:0 auto;padding:1.3rem 1.2rem 5rem}
.head{margin-bottom:1rem;display:flex;gap:1rem;align-items:flex-start}
.head .num{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.15rem;background:var(--pc,var(--navy))}
.head h1{font-size:1.45rem}
.head .tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc,var(--grey))}
.head p{color:var(--navy2);max-width:80ch;margin:.25rem 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem}
.card>h3{font-size:1rem;margin-bottom:.6rem}
.card>h3 small{font-weight:400;color:var(--grey);font-size:.82rem}
.grid{display:grid;gap:.75rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
label.l{display:block;font-size:.78rem;font-weight:600;color:var(--navy2);margin-bottom:.2rem}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:5px;background:#fff}
textarea{min-height:62px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#AEB8C6}
.hint{font-size:.8rem;color:var(--grey)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.45rem .85rem;cursor:pointer;font-size:.88rem;color:var(--navy);display:inline-flex;align-items:center;gap:.35rem;text-decoration:none}
.btn:hover{border-color:#AEB8C6;background:#F8FAFC}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#0F539F}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.go:hover{background:#246F17}
.btn.del{color:var(--red);border-color:#EBC4C0}
.btn.sm{padding:.2rem .5rem;font-size:.78rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}
.navbtns{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}

/* decision diamond box */
.dec{border:1px solid #F0D49A;background:var(--amber-t);border-radius:8px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;gap:.9rem;align-items:flex-start}
.dec .dia{flex:0 0 auto;width:1.6rem;height:1.6rem;background:var(--amber);transform:rotate(45deg);border-radius:3px;margin:.35rem .25rem 0}
.dec .q{font-weight:700}
.dec .q small{display:block;font-weight:400;color:var(--navy2);font-size:.82rem}
.dec .yn{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap}
.dec .yn button{border:1px solid #D9B76E;background:#fff;border-radius:5px;padding:.3rem .8rem;cursor:pointer;font-size:.85rem}
.dec .yn button.on{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600}
.dec .out{margin-top:.55rem;font-size:.88rem;background:#fff;border-radius:5px;padding:.5rem .7rem;border-left:3px solid var(--amber)}
.dec .out.stop{border-left-color:var(--red)}
.dec .out.ok{border-left-color:var(--green)}
.loop{display:inline-flex;align-items:center;gap:.25rem;font-size:.82rem;color:var(--blue);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
.inl-dec{display:inline-flex;gap:.25rem;align-items:center}
.inl-dec button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:.12rem .5rem;font-size:.78rem;cursor:pointer}
.inl-dec button.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* tables & items */
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;background:#fff}
.tbl th{text-align:left;background:#EEF2F6;border:1px solid var(--line);padding:.45rem .55rem;font-size:.76rem;color:var(--navy2)}
.tbl td{border:1px solid var(--line2);padding:.45rem .55rem;vertical-align:top}
.wrap{overflow-x:auto}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:.08rem .45rem;border-radius:10px;white-space:nowrap}
.p1{background:var(--red-t);color:var(--red)} .p2{background:var(--amber-t);color:var(--amber)}
.p3{background:var(--blue-t);color:var(--blue)} .p4{background:var(--line2);color:var(--grey)}
.pok{background:var(--green-t);color:var(--green)}
.item{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:.7rem}
.item>.ih{display:flex;gap:.6rem;align-items:center;padding:.55rem .8rem;border-bottom:1px solid var(--line2);background:#FAFBFD;border-radius:8px 8px 0 0}
.item>.ih b{font-family:var(--mono);font-size:.82rem;color:var(--navy2)}
.item>.ib{padding:.75rem .8rem}
.empty{border:1px dashed #B9C3D0;border-radius:8px;padding:1.4rem;text-align:center;color:var(--navy2);background:#fff;margin-bottom:1rem}
.empty p{max-width:60ch;margin:0 auto .7rem}
.tips{margin:0;padding-left:1.1rem}
.tips li{margin-bottom:.3rem}
.checks{list-style:none;padding:0;margin:0}
.checks li{margin-bottom:.35rem}
.checks label{display:flex;gap:.5rem;align-items:flex-start;cursor:pointer;font-size:.9rem}
.checks input{margin-top:.25rem}
.tagset{display:flex;flex-wrap:wrap;gap:.3rem}
.tg{border:1px solid var(--line);background:#fff;border-radius:14px;padding:.18rem .6rem;font-size:.78rem;cursor:pointer}
.tg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tg small{font-family:var(--mono);opacity:.75;margin-right:.2rem}
.tgroup{margin-bottom:.5rem}
.tgroup>div:first-child{font-size:.74rem;font-weight:700;color:var(--grey);margin-bottom:.25rem}
details.more summary{cursor:pointer;font-size:.85rem;color:var(--blue);margin:.2rem 0}
.notice{border-left:4px solid var(--blue);background:var(--blue-t);padding:.6rem .85rem;border-radius:0 6px 6px 0;margin-bottom:1rem;font-size:.9rem}
.notice.warn{border-color:var(--amber);background:var(--amber-t)}
.notice.bad{border-color:var(--red);background:var(--red-t)}
.notice.good{border-color:var(--green);background:var(--green-t)}
.hta-row{display:flex;gap:.5rem;align-items:flex-start;padding:.4rem .5rem;border-bottom:1px solid var(--line2)}
.hta-row:last-child{border-bottom:0}
.hta-num{font-family:var(--mono);font-size:.82rem;color:var(--teal);min-width:3rem;padding-top:.45rem;font-weight:600}
.hta-row .grow{flex:1;min-width:0}
.hta-row.l1{padding-left:2rem}.hta-row.l2{padding-left:4rem}
.hta-ctl{display:flex;gap:.2rem;padding-top:.25rem;flex-wrap:wrap}
.taskbar{display:flex;gap:.6rem;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--analyse);border-radius:6px;padding:.55rem .8rem;margin-bottom:1rem}
.taskbar select{max-width:520px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--navy2)}

/* home */
.intro summary{cursor:pointer;list-style:none}
.intro summary::-webkit-details-marker{display:none}
.intro summary h3{display:inline}
.intro summary h3::before{content:"▸ ";color:var(--blue)}
.intro[open] summary h3::before{content:"▾ "}
.introgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.5rem;margin-top:.8rem}
.introgrid section{min-width:0}
.introgrid .wide{grid-column:1/-1}
.introgrid h4{margin:0 0 .4rem;font-size:1rem;color:var(--ink,#16243a);border-bottom:2px solid var(--line);padding-bottom:.25rem}
.introgrid p{margin:0 0 .5rem;line-height:1.5}
.timeline{list-style:none;margin:0;padding:0 0 0 .9rem;border-left:3px solid var(--line)}
.timeline li{position:relative;margin-bottom:.45rem;line-height:1.45}
.timeline li::before{content:"";position:absolute;left:-1.27rem;top:.4rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--blue)}
.timeline b{display:inline-block;min-width:4.6rem}
@media(max-width:760px){.introgrid{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:240px 1fr;gap:1.5rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.3rem 1.5rem;margin-bottom:1.2rem}
.hero img{width:100%;height:auto}
.hero h1{font-size:1.6rem;margin-bottom:.4rem}
.phases4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.9rem 0}
.phases4 div{border-radius:6px;padding:.5rem .6rem;font-size:.8rem;border-top:3px solid}
.phases4 b{display:block;font-size:.85rem}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.55rem 1rem;border-radius:6px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.report h2{font-size:1.15rem;margin:1.2rem 0 .5rem;padding-bottom:.25rem;border-bottom:2px solid var(--line)}
.print-only{display:none}

@media (max-width:900px){
  .g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}
  .hero{grid-template-columns:1fr}.hero img{max-width:200px}
  .phases4{grid-template-columns:1fr 1fr}
  .study-name{display:none}
  .chip{padding:.3rem .45rem}
  .chip em{display:none}
}
@media print{
  body{background:#fff;font-size:10pt}
  .top,.flow,.no-print,.navbtns,.toast{display:none !important}
  main{padding:0;max-width:none}
  .card,.item{break-inside:avoid;border-color:#999}
  .print-only{display:block}
  .tbl th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
"use strict";
/* ==================================================================
   SCTA Studio by risk2Safe — one-file app.
   Follows the SCTA process flowchart: Scope (steps 1-2), Analyse
   (3-5), Act (6), Learn (7), with its decision points and loop-backs.
   Studies are saved in this browser (localStorage). Download gives a
   study file; Open brings one back; Excel and Report give outputs.
   ================================================================== */

const STORE = "risk2safe.scta.studies.v1";
const uid = p => p + "-" + Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);

/* ---------------- reference lists (plain-language paraphrase) ---------------- */
const TASK_ROLES = ["Can start (initiate) a major accident","Prevents or detects it","Controls or mitigates it","Emergency response"];
const TASK_TYPES = ["Routine operation","Non-routine operation","Start-up or shutdown","Maintenance or isolation","Testing a protective system","Inspection or monitoring","Checking, handover or communication","Decision or diagnosis","Emergency response","Other"];
const HML = [["H","High"],["M","Medium"],["L","Low"]];
const CONSEQ_HELP = {H:"Failure directly causes a major accident",M:"Escalates only if other barriers also fail",L:"Should not lead to a major accident"};
const HUMAN_HELP = {H:"Lots of hands-on interaction with safety critical equipment",M:"Mix of people and automation",L:"Mostly automatic (but remember its maintenance)"};
const MISSED_PROMPTS = [
  "Tasks that open up the process (breaking containment, draining, sampling)",
  "Maintaining or testing a protective system (trips, alarms, relief valves)",
  "Tasks that create the condition a protection guards against (start-up, shutdown, transfers)",
  "Mental tasks: diagnosis, checking, communication, shift handover",
  "Non-routine work and maintenance",
  "Emergency response",
  "Tasks that have no procedure (ask site staff)"
];
const GUIDEWORDS = [
  {g:"Action", items:[["A1","Too long or too short"],["A2","At the wrong moment"],["A3","Wrong direction"],["A4","Too much or too little"],["A5","Too fast or too slow"],["A6","Misaligned"],["A7","Right action, wrong item"],["A8","Wrong action, right item"],["A9","Not done"],["A10","Only part done"],["A11","Too early or too late"],["A12","Out of sequence"],["A13","Left in wrong place"]]},
  {g:"Checking", items:[["C1","Check not done"],["C2","Check incomplete"],["C3","Right check, wrong item"],["C4","Wrong check, right item"],["C5","Check too early or late"]]},
  {g:"Retrieval (finding information)", items:[["R1","Not obtained"],["R2","Wrong information"],["R3","Incomplete"],["R4","Misread or misunderstood"]]},
  {g:"Communication", items:[["I1","Not passed on"],["I2","Wrong information passed on"],["I3","Only part passed on"],["I4","Unclear"]]},
  {g:"Selection", items:[["S1","Nothing selected"],["S2","Wrong selection"]]},
  {g:"Planning", items:[["P1","No plan"],["P2","Wrong plan"]]},
  {g:"Diagnosis", items:[["D1","Situation not recognised"],["D2","Wrong diagnosis"],["D3","Diagnosis too late"]]},
  {g:"Violation", items:[["V1","Rule knowingly not followed"]]}
];
const PIFS = [
  {g:"Job", items:["Access to the equipment","Lighting, noise or weather","Housekeeping and clutter","Working at height or in a confined space","Equipment not available when needed","Design, labelling or layout","Condition and maintenance","Information shown by instruments","No measurement available","Procedure not available at the job","Procedure out of date or wrong","Procedure hard to follow","No procedure exists for this task","Permit or isolation controls"]},
  {g:"Person", items:["Training and competence","Refresher training","Recent experience of this task","Task rarely done","Fatigue or shift pattern","Distractions","Doing several tasks at once"]},
  {g:"Organisation", items:["Supervision","Staffing levels","Communication between teams or departments","Who is responsible is unclear","Handover between shifts","Time or production pressure","Management of change","People use a different method in practice","Action tracking and follow-up","Safety culture"]}
];
const FTYPES = ["Slip","Lapse","Mistake","Violation"];
const FTYPE_HELP = {Slip:"Right intention, wrong action",Lapse:"A step forgotten",Mistake:"Wrong intention or decision",Violation:"Rule knowingly not followed"};
const FTYPE_FIX = {Slip:"Better equipment and display design, labelling, fewer distractions.",Lapse:"Checklists, prompts, place-keeping, fewer interruptions.",Mistake:"Training, decision aids, supervision, clearer procedures.",Violation:"Work design (make the right way the easy way), supervision, behavioural safety."};
const HIER = [[1,"Remove the hazard"],[2,"Remove the human contribution (reliable automation)"],[3,"Prevent or reduce the consequence (extra barrier)"],[4,"Assure correct performance by engineering (interlock, sequencing)"],[5,"Improve the PIFs (access, lighting, time, supervision, procedures, training)"]];
const QCHECKS = [
  "The reason each task was chosen is written down (linked to a named MAH or past incident).",
  "Interviews and observation or walk-through were done, not only document review.",
  "Guidewords were applied systematically to each key step.",
  "The workforce who do the task were involved.",
  "PIFs are recorded and each one is linked to an action.",
  "ALARP reasoning is written for measures adopted and rejected.",
  "Actions have owners and dates and are tracked like HAZOP actions (KPI)."
];

/* ---------------- state & storage ---------------- */
let DB = {};            // all studies in this browser, by id
let S = null;           // open study
let view = "home";      // "home" | 0..7 | "actions" | "report"
let curTask = "";       // SCT being analysed in steps 3-6
let saveTimer = null;

function blank(){
  return { app:"risk2Safe SCTA Studio", format:3, id:uid("study"), created:new Date().toISOString(), saved:"",
    meta:{ ref:"", title:"", site:"", unit:"", lead:"", team:"", scope:"", date:today(), rev:"0", firstStudy:"", sctDef:"" },
    dec:{}, hazards:[], tasks:[], steps:[], fails:[], prompts:{}, review:{qc:{}, weak:"", feedback:"", notes:""} };
}
function loadDB(){ try{ DB = JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ DB = {}; } }
function persist(){
  if(!S) return;
  S.saved = new Date().toISOString();
  DB[S.id] = S;
  try{ localStorage.setItem(STORE, JSON.stringify(DB)); paintSaved(true); }
  catch(e){ paintSaved(false); toast("This browser could not save. Use Download to keep a copy."); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); $("studyName").querySelector(".saved") && ($("studyName").querySelector(".saved").textContent = "Saving…"); }
function paintSaved(ok){
  const el = $("studyName").querySelector(".saved");
  if(el) el.textContent = ok ? "Saved in this browser " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Not saved";
}
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("on"), 2600); }

/* ---------------- calculations ---------------- */
const lvl = v => ({H:3,M:2,L:1})[v] || 0;
function priority(t){
  if(!t.conseq || !t.human) return {n:0, label:"Not rated", cls:"p4"};
  const c = lvl(t.conseq), h = lvl(t.human);
  if(c===3 && h===3) return {n:1, label:"1 · High × High", cls:"p1"};
  if(c+h===5) return {n:2, label:"2 · High", cls:"p2"};
  if(c*h>=3) return {n:3, label:"3 · Medium", cls:"p3"};
  return {n:4, label:"4 · Low", cls:"p4"};
}
const sortedTasks = () => S.tasks.slice().sort((a,b)=>(priority(a).n||9)-(priority(b).n||9));
function stepsOf(tid){ return S.steps.filter(s=>s.taskId===tid); }
function stepNums(tid){
  let a=0,b=0,c=0; const m = {};
  stepsOf(tid).forEach(s=>{ if(s.lvl===0){a++;b=0;c=0;m[s.id]=""+a;} else if(s.lvl===1){b++;c=0;m[s.id]=a+"."+b;} else {c++;m[s.id]=a+"."+b+"."+c;} });
  return m;
}
function stepLabel(id){ const s = S.steps.find(x=>x.id===id); if(!s) return "—"; return (stepNums(s.taskId)[id]||"")+" "+s.text; }
const keptFails = tid => S.fails.filter(f=>(!tid||f.taskId===tid) && f.credible!=="no" && f.mah!=="no");
function allMeasures(){
  const out = [];
  S.fails.forEach(f=>(f.meas||[]).forEach(m=>{ const t = S.tasks.find(x=>x.id===f.taskId)||{}; out.push({f,m,t}); }));
  return out;
}
const actions = () => allMeasures().filter(x=>x.m.alarp!=="Reject");
function hazRef(id){ const h = S.hazards.find(x=>x.id===id); return h ? h.ref : ""; }
function stepDone(n){
  if(!S) return false;
  switch(n){
    case 0: return !!(S.meta.title||S.meta.ref);
    case 1: return S.hazards.length>0 && S.dec.hazClear==="yes";
    case 2: return S.tasks.some(t=>priority(t).n);
    case 3: return S.tasks.some(t=>t.ev&&(t.ev.intv||t.ev.obs));
    case 4: return S.steps.length>0;
    case 5: return S.fails.length>0;
    case 6: return allMeasures().length>0;
    case 7: return Object.values(S.review.qc||{}).filter(Boolean).length>=QCHECKS.length;
  }
  return false;
}

/* ---------------- migration of older SCTA Workbench files ---------------- */
function migrate(d){
  if(d && d.format===3) return Object.assign(blank(), d, {meta:Object.assign(blank().meta, d.meta)});
  const s = blank();
  const m = d.meta||{};
  Object.assign(s.meta, {ref:m.ref||"", title:((d.hazards||[])[0]||{}).title||"", site:m.site||"", unit:m.fac||"", lead:m.lead||"", team:m.team||"", scope:m.scope||"", date:m.date||today(), rev:m.rev||"0"});
  s.review.notes = m.review||"";
  s.hazards = (d.hazards||[]).map(h=>({id:h.id||uid("haz"), ref:h.ref||"", title:h.title||"", src:h.src||"", cons:h.cons||"", desc:h.desc||""}));
  if(s.hazards.length) s.dec.hazClear = "yes";
  const toHML = (v,hi,mid) => +v>=hi ? "H" : +v>=mid ? "M" : v ? "L" : "";
  s.tasks = (d.tasks||[]).map(t=>({id:t.id||uid("sct"), ref:t.ref||"", title:t.title||"", type:t.cat||"", who:t.role||"", proc:t.proc||"",
    hazIds:t.hazIds||[], roles:[], conseq:t.conseq||toHML(t.sev,4,3), human:t.human||toHML(t.rel,4,3), why:t.notes||"",
    ev:{docs:!!(t.ev&&t.ev.proc), intv:!!(t.ev&&t.ev.intv), obs:!!(t.ev&&(t.ev.obs||t.ev.walk))}, evNotes:t.evNotes||"", wad:"", pifsSeen:"", goal:"", validated:false}));
  s.steps = (d.steps||[]).map(x=>({id:x.id||uid("st"), taskId:x.taskId, lvl:x.lvl||0, text:x.text||"", plan:"", stop:"", why:""}));
  s.fails = (d.fails||[]).map(f=>({id:f.id||uid("f"), taskId:f.taskId, stepId:f.stepId, gw:f.gw||[], desc:f.desc||"", credible:"yes", mah:"yes", dropWhy:"",
    cons:f.cons||"", safe:f.safe||"", pifs:f.pifs||[], ftype:(f.ftype||"").split(" ")[0]||"",
    meas:(f.meas||[]).map(x=>({id:uid("m"), text:x.text||"", hier:+x.hier||5, pm:"Prevent", alarp:x.alarp==="Rejected"?"Reject":(x.alarp==="To decide"?"Decide":"Adopt"), reason:x.reason||"", owner:x.owner||"", due:x.due||"", status:x.status||"Open"}))}));
  (d.qc||[]).forEach((v,i)=>{ if(v) s.review.qc[i]=true; });
  return s;
}

/* ---------------- small UI builders ---------------- */
function decision(key, q, sub, opts){
  // opts: {yes:"Yes", no:"No", out:{yes:html|fn, no:html|fn}, cls:{yes,no}}
  const v = S.dec[key]||"";
  const o = opts||{};
  const out = v && o.out && o.out[v] ? (typeof o.out[v]==="function" ? o.out[v]() : o.out[v]) : "";
  const cls = v && o.cls ? (o.cls[v]||"") : "";
  return `<div class="dec"><div class="dia"></div><div style="flex:1"><div class="q">${esc(q)}${sub?`<small>${sub}</small>`:""}</div>
    <div class="yn"><button data-dec="${key}" data-v="yes" class="${v==="yes"?"on":""}">${esc(o.yes||"Yes")}</button><button data-dec="${key}" data-v="no" class="${v==="no"?"on":""}">${esc(o.no||"No")}</button></div>
    ${out?`<div class="out ${cls}">${out}</div>`:""}</div></div>`;
}
const loop = (to, text) => `<button class="loop" data-go="${to}">↺ ${esc(text)}</button>`;
const inp = (k,id,f,val,ph,type) => `<input type="${type||"text"}" data-k="${k}" data-id="${id}" data-f="${f}" value="${esc(val)}" placeholder="${esc(ph||"")}">`;
const txt = (k,id,f,val,ph) => `<textarea data-k="${k}" data-id="${id}" data-f="${f}" placeholder="${esc(ph||"")}">${esc(val)}</textarea>`;
const sel = (k,id,f,val,opts,blankLabel,rr) => `<select data-k="${k}" data-id="${id}" data-f="${f}" ${rr?"data-rr":""}>${blankLabel!=null?`<option value="">${esc(blankLabel)}</option>`:""}${opts.map(o=>{ const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}"${String(val)===String(v)?" selected":""}>${esc(l)}</option>`; }).join("")}</select>`;
const field = (label, html, cls) => `<div class="${cls||""}"><label class="l">${esc(label)}</label>${html}</div>`;
function head(n, phase, title, lede){
  const pc = {scope:"var(--scope)",analyse:"var(--analyse)",act:"var(--act)",learn:"var(--learn)",out:"var(--navy2)"}[phase];
  const names = {scope:"Scope · what matters",analyse:"Analyse · one task at a time",act:"Act · reduce risk to ALARP",learn:"Learn · improve the method",out:"Output"};
  return `<div class="head" style="--pc:${pc}"><div class="num">${n}</div><div><div class="tag">${names[phase]}${typeof n==="number"&&n>0?" · Step "+n:""}</div><h1>${esc(title)}</h1>${lede?`<p>${lede}</p>`:""}</div></div>`;
}
function navBtns(prev, next, nextLabel){
  return `<div class="navbtns no-print"><div>${prev!=null?`<button class="btn" data-go="${prev}">← Back</button>`:""}</div><div>${next!=null?`<button class="btn go" data-go="${next}">${esc(nextLabel||"Next step →")}</button>`:""}</div></div>`;
}
function taskBar(){
  if(!S.tasks.length) return `<div class="notice warn">No safety critical tasks yet. ${loop(2,"Go to Step 2 and list them")}</div>`;
  if(!S.tasks.find(t=>t.id===curTask)) curTask = sortedTasks()[0].id;
  return `<div class="taskbar no-print"><b style="white-space:nowrap">Task being analysed</b>
    <select id="pickTask" class="grow">${sortedTasks().map(t=>`<option value="${t.id}"${t.id===curTask?" selected":""}>${esc(t.ref)} · ${esc(t.title||"(untitled)")} — priority ${esc(priority(t).label)}</option>`).join("")}</select></div>`;
}
const cur = () => S.tasks.find(t=>t.id===curTask);

function render(){
  const m = $("main");
  const inStudy = !!S && view!=="home";
  $("flow").hidden = !inStudy;
  ["bReport","bExcel","bSave"].forEach(b=>$(b).hidden = !inStudy);
  $("studyName").innerHTML = inStudy ? `<b>${esc(S.meta.ref||"Study")}</b> · ${esc(S.meta.title||"")}<div class="saved">Saved in this browser</div>` : "";
  document.querySelectorAll(".chip").forEach(c=>{ c.classList.toggle("on", String(view)===c.dataset.go); c.classList.toggle("done", inStudy && /^\d$/.test(c.dataset.go) && stepDone(+c.dataset.go) && String(view)!==c.dataset.go); });
  const R = {home:vHome, 0:v0, 1:v1, 2:v2, 3:v3, 4:v4, 5:v5, 6:v6, 7:v7, actions:vActions, report:vReport}[view] || vHome;
  m.innerHTML = R();
  if(S) paintSaved(true);
}
function go(v){
  if(v!=="home" && !S) v = "home";
  view = (/^\d$/.test(String(v))) ? +v : v;
  render(); window.scrollTo(0,0);
  try{ history.replaceState(null,"", S && view!=="home" ? "#"+S.id+"/"+view : location.pathname); }catch(e){}
}

    <div><h1>SCTA Studio</h1><p>Safety Critical Task Analysis in seven steps. Start from the major accident hazards, find the tasks that matter, understand how they are really done, find what can go wrong, and fix it to ALARP.</p>
    <div class="phases4">
      <div style="border-color:var(--scope);background:var(--blue-t)"><b>Scope</b>1 Hazards · 2 Tasks</div>
      <div style="border-color:var(--analyse);background:var(--teal-t)"><b>Analyse</b>3 Understand · 4 Break down · 5 Failures</div>
      <div style="border-color:var(--act);background:var(--red-t)"><b>Act</b>6 Safety measures</div>
      <div style="border-color:var(--learn);background:var(--green-t)"><b>Learn</b>7 Review</div></div>
    <div class="row"><button class="btn pri" data-act="new">+ New study</button><button class="btn" data-act="example">Open the worked example</button><button class="btn" data-act="open">Open a study file…</button></div></div></div>
  <details class="intro card"${list.length?"":" open"}><summary><h3>About SCTA <small>— what it is, why it matters, and where it came from</small></h3></summary>
  <div class="introgrid">
    <section><h4>What is SCTA?</h4>
      <p>Safety Critical Task Analysis is a structured way to look at the <b>human side of major accident risk</b>. It picks out the tasks where a person's action, or failure to act, could start a major accident or fail to stop one. It then asks how those tasks are really done, what could go wrong, and why. Finally, it puts measures in place to make failure less likely or easier to recover from.</p>
      <p>It works alongside HAZOP, bow ties and LOPA. Those studies show <i>where</i> people are relied on. SCTA checks <i>whether that reliance is justified</i>.</p></section>
    <section><h4>Why is it required?</h4>
      <ul class="tips">
        <li>Most major accidents in oil, gas and chemicals have human and organisational failures in their causes. Typical examples are an overfill during a transfer, a valve left open after maintenance, a missed alarm, or a poor shift handover.</li>
        <li>Many safety barriers depend on a person: an operator responding to an alarm, an isolation, a line-up, or a test of a trip. If the task behind the barrier is weak, the barrier is weak.</li>
        <li>Regulators expect it. Under major hazard regimes such as COMAH and the offshore safety case, sites have to show they have identified their safety critical tasks and managed the human factors in them.</li>
        <li>It turns "human error" from a blame word into causes you can fix, such as design, layout, alarms, procedures, workload, staffing and supervision.</li></ul></section>
    <section><h4>Where most of the industry stops</h4>
      <ul class="tips">
        <li><b>A number in the risk study.</b> HAZOP or LOPA takes credit for "operator responds" or uses a generic error rate, without checking the task can actually be done in the time available.</li>
        <li><b>A list, not an analysis.</b> Safety critical tasks are listed for the safety report, but never broken down or examined.</li>
        <li><b>Personal safety only.</b> The job safety analysis or task risk assessment covers slips, trips and lifting, but not the actions that prevent loss of containment.</li>
        <li><b>"Retrain and update the procedure".</b> These are the weakest measures, used for almost every finding, while design and engineering fixes are not considered.</li>
        <li><b>Work as imagined.</b> The procedure is assumed to be how the job is done, without talking to or watching the people who do it.</li></ul>
      <p class="hint">SCTA is designed to go past each of these points. The app's decision prompts and weak-study checks flag them for you.</p></section>
    <section><h4>How SCTA evolved</h4>
      <ul class="timeline">
        <li><b>1960s–80s</b> Hierarchical task analysis and human reliability methods developed in the process, nuclear and defence industries.</li>
        <li><b>1988</b> The Piper Alpha disaster, where permit-to-work and handover failures contributed. The inquiry that followed led to the offshore safety case regime.</li>
        <li><b>1999</b> The UK HSE published <i>Reducing error and influencing behaviour</i> (HSG48) and guidance on assessing safety critical tasks offshore.</li>
        <li><b>2000s</b> Human factors became a standard part of major hazard inspection. "Identifying human failures" and safety critical tasks became core topics. The Texas City and Buncefield accidents (both 2005) reinforced the need.</li>
        <li><b>2011</b> The Energy Institute published <i>Guidance on human factors safety critical task analysis</i>, a practical step-by-step method.</li>
        <li><b>2020</b> The second edition was published, updated with lessons from about ten years of use across the industry.</li></ul></section>
    <section class="wide"><h4>The Energy Institute's role</h4>
      <p>The <b>Energy Institute (EI)</b> is the professional body for the energy industry. Its Human and Organisational Factors Committee brings together operators, contractors and specialists to write practical, freely available good-practice guidance. The EI turned the regulator's expectations into a method that a site team can actually run: the seven steps followed in this app, with worked examples, guidewords and checklists. The guidance is free to download from the EI website, and it is widely used as the reference approach for SCTA. Related EI guidance covers human factors in task-based risk assessment and in the wider safety management system.</p>
      <p class="hint">This page and the app paraphrase the method in plain language. Use the EI publication itself for the full guidance.</p></section>
  </div></details>

/* ---------- step 0: start ---------- */
function v0(){
  const m = S.meta;
  return head(0,"scope","Start the study","Who is doing it and what it covers. These details go on the report.")+
  `<div class="card"><div class="grid g4">
    ${field("Study reference", `<input type="text" data-m="ref" value="${esc(m.ref)}" placeholder="SCTA-2026-001">`)}
    ${field("Study title", `<input type="text" data-m="title" value="${esc(m.title)}" placeholder="Separator gas blow-by">`,"span2")}
    ${field("Revision", `<input type="text" data-m="rev" value="${esc(m.rev)}">`)}
    ${field("Site", `<input type="text" data-m="site" value="${esc(m.site)}">`)}
    ${field("Unit or area", `<input type="text" data-m="unit" value="${esc(m.unit)}">`)}
    ${field("Study lead", `<input type="text" data-m="lead" value="${esc(m.lead)}">`)}
    ${field("Date", `<input type="date" data-m="date" value="${esc(m.date)}">`)}
  </div><div class="grid g2" style="margin-top:.75rem">
    ${field("Team (include people who do the tasks)", `<textarea data-m="team" placeholder="One per line: name — role">${esc(m.team)}</textarea>`)}
    ${field("Scope and boundaries", `<textarea data-m="scope" placeholder="What is in and out of this study">${esc(m.scope)}</textarea>`)}
  </div></div>`+
  decision("first","Is this the first SCTA on this site?","No method or track record yet?",{
    out:{yes:`<b>Run a pilot.</b> Pick one task clearly linked to a major accident hazard or a past incident. Run Steps 3 to 6 on it as a trial, adapt the method to the site, and use the result to win management commitment.`,
         no:`<b>Plan the programme.</b> Start with the highest-risk units and schedule the rest. Agree the team, templates and guideword subsets.`}, cls:{yes:"ok",no:"ok"}})+
  navBtns(null,1,"Step 1: Hazards →");
}

function v1(){
  return head(1,"scope","Identify the main hazards","Take the major accident hazards (MAHs) from documents that already exist: safety case or COMAH report, HAZOP, bow ties, risk assessments. Confirm with whoever wrote them that the list is current.")+
  (S.hazards.length ? S.hazards.map((h,i)=>`<div class="item"><div class="ih"><b>${esc(h.ref||"MAH")}</b><span class="grow" style="flex:1">${esc(h.title)}</span><button class="btn sm del" data-delk="hazards" data-id="${h.id}">Remove</button></div><div class="ib"><div class="grid g4">
      ${field("Reference", inp("hazards",h.id,"ref",h.ref,"MAH-01"))}
      ${field("Major accident hazard", inp("hazards",h.id,"title",h.title,"Gas release from …"),"span2")}
      ${field("Where it came from", inp("hazards",h.id,"src",h.src,"HAZOP node 4 / bow tie BT-02"))}
      ${field("Worst credible outcome", txt("hazards",h.id,"cons",h.cons,"Fire, explosion, toxic release…"),"span2")}
      ${field("Plant area and how it happens", txt("hazards",h.id,"desc",h.desc,"Sequence of events; human actions that start, stop or limit it"),"span2")}

function weakSigns(){
  const out = [];
  const ev = S.tasks.filter(t=>t.ev&&(t.ev.intv||t.ev.obs)).length;
  if(S.tasks.length && ev<S.tasks.length) out.push([3,`${S.tasks.length-ev} task(s) analysed from the desk only — no interview or observation.`]);
  if(S.steps.length>40 && S.fails.length<5) out.push([4,"Lots of task detail but few failures — the study may be lost in detail."]);
  if(S.fails.length && !S.fails.some(f=>f.ftype==="Violation"||(f.gw||[]).includes("V1"))) out.push([5,"No violations considered. Ask whether the correct method is also the easiest one."]);
  if(S.tasks.length && !S.tasks.some(t=>/maint|test|isolat/i.test((t.type||"")+" "+t.title))) out.push([2,"No maintenance or testing tasks on the list."]);
  const a = actions(); if(a.length && a.filter(x=>+x.m.hier===5).length/a.length>=.8) out.push([6,"Measures go straight to training and procedures (level 5)."]);
  const kept = keptFails(); const noMeas = kept.filter(f=>!(f.meas||[]).length).length;
  if(noMeas) out.push([6,`${noMeas} kept failure(s) have no measure.`]);
  const noPif = kept.filter(f=>!(f.pifs||[]).length).length;
  if(noPif) out.push([5,`${noPif} kept failure(s) have no PIFs recorded.`]);
  const rej = allMeasures().filter(x=>x.m.alarp==="Reject"&&!(x.m.reason||"").trim()).length;
  if(rej) out.push([6,`${rej} rejected measure(s) have no written reason.`]);
  const own = a.filter(x=>!x.m.owner||!x.m.due).length;
  if(own) out.push([6,`${own} action(s) have no owner or due date.`]);
  return out;
}

/* ---------- action register ---------- */
function vActions(){
  const a = actions();
  return head("›","out","Action register","Every adopted or undecided measure, ready to track like HAZOP actions.")+
  (a.length?`<div class="wrap card" style="padding:0"><table class="tbl"><thead><tr><th>No.</th><th>Task</th><th>Failure</th><th>Action</th><th>Level</th><th>ALARP</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.ref)}</td><td>${esc(x.f.desc)}</td><td>${esc(x.m.text)}</td><td>${x.m.hier}</td><td>${esc(x.m.alarp==="Decide"?"Not decided":"Adopted")}</td><td>${esc(x.m.owner)||'<span class="hint">—</span>'}</td><td>${esc(x.m.due)||"—"}</td><td><span class="pill ${x.m.status==="Closed"?"pok":x.m.status==="In progress"?"p3":"p2"}">${esc(x.m.status||"Open")}</span></td></tr>`).join("")}</tbody></table></div>`
  :`<div class="empty"><p>No actions yet. They come from Step 6.</p></div>`)+
  `<div class="row no-print"><button class="btn" data-act="csv">Download as CSV</button><button class="btn" data-act="excel">Download whole study as Excel</button></div>`;
}

const coll = k => S[k];
document.addEventListener("input", e=>{
  const el = e.target; if(!S) return;
  if(el.dataset.m!=null){ S.meta[el.dataset.m] = el.value; save(); if(el.dataset.m==="ref"||el.dataset.m==="title") $("studyName").firstChild && ($("studyName").innerHTML = `<b>${esc(S.meta.ref||"Study")}</b> · ${esc(S.meta.title||"")}<div class="saved">Saving…</div>`); return; }
  if(el.dataset.r!=null){ S.review[el.dataset.r] = el.value; save(); return; }
  if(el.dataset.k){ const it = coll(el.dataset.k).find(x=>x.id===el.dataset.id); if(it){ it[el.dataset.f] = el.value; save(); } return; }
  if(el.dataset.mf){ const f = S.fails.find(x=>x.id===el.dataset.fid); const m = f && f.meas.find(x=>x.id===el.dataset.mid); if(m){ m[el.dataset.mf] = el.dataset.mf==="hier" ? +el.value : el.value; save(); } }
});
document.addEventListener("change", e=>{
  const el = e.target; if(!S) return;
  if(el.id==="pickTask"){ curTask = el.value; render(); return; }
  if(el.dataset.prompt!=null){ S.prompts[el.dataset.prompt] = el.checked; save(); return; }
  if(el.dataset.ev){ const t = cur(); t.ev = t.ev||{}; t.ev[el.dataset.ev] = el.checked; save(); render(); return; }
  if(el.dataset.qc!=null){ S.review.qc[el.dataset.qc] = el.checked; save(); render(); return; }
  if(el.dataset.rr!=null || el.dataset.mf==="hier"){ render(); }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("button,a"); if(!b) return;
  const d = b.dataset;
  if(d.go!=null){ e.preventDefault(); go(d.go); return; }
  if(b.id==="goHome"||b.id==="bHome"){ S && persist(); S = null; go("home"); return; }
  if(b.id==="bReport"){ go("report"); return; }
  if(b.id==="bExcel"){ downloadExcel(); return; }
  if(b.id==="bSave"){ downloadStudy(S); return; }
  if(d.openid){ e.preventDefault(); loadDB(); S = migrate(DB[d.openid]); curTask=""; go(0); return; }
  if(d.dl){ loadDB(); downloadStudy(DB[d.dl]); return; }
  if(d.delid){ loadDB(); const x = DB[d.delid]; if(confirm(`Delete study ${x.meta.ref||x.meta.title||""} from this browser?\n\nDownload it first if you may need it.`)){ delete DB[d.delid]; localStorage.setItem(STORE, JSON.stringify(DB)); render(); toast("Study deleted."); } return; }
  if(d.act) return act(d.act);
  if(!S) return;
  if(d.dec){ S.dec[d.dec] = S.dec[d.dec]===d.v ? "" : d.v; save(); render(); return; }
  if(d.delk){ if(!confirm("Remove this item?")) return; const k = d.delk;
    if(k==="tasks"){ S.steps = S.steps.filter(s=>s.taskId!==d.id); S.fails = S.fails.filter(f=>f.taskId!==d.id); }
    if(k==="steps"){ S.fails.forEach(f=>{ if(f.stepId===d.id) f.stepId=""; }); }
    if(k==="hazards"){ S.tasks.forEach(t=>t.hazIds=(t.hazIds||[]).filter(x=>x!==d.id)); }
    S[k] = S[k].filter(x=>x.id!==d.id); save(); render(); return; }
  if(d.taghaz){ const t = S.tasks.find(x=>x.id===d.id); t.hazIds = t.hazIds||[]; const i = t.hazIds.indexOf(d.taghaz); i<0?t.hazIds.push(d.taghaz):t.hazIds.splice(i,1); save(); render(); return; }
  if(d.analyse){ curTask = d.analyse; go(3); return; }
  if(d.stop){ const s = S.steps.find(x=>x.id===d.stop); s.stop = s.stop===d.v?"":d.v; save(); render(); return; }
  if(d.sub){ const s = S.steps.find(x=>x.id===d.sub); const i = S.steps.indexOf(s); let j = i+1; while(j<S.steps.length && S.steps[j].taskId===s.taskId && S.steps[j].lvl>s.lvl) j++;
    S.steps.splice(j,0,{id:uid("st"),taskId:s.taskId,lvl:s.lvl+1,text:"",stop:"",why:""}); s.stop = "more"; save(); render(); return; }
  if(d.mv){ const rows = stepsOf(curTask); const s = rows.find(x=>x.id===d.mv); const k = rows.indexOf(s)+(+d.d); if(k<0||k>=rows.length) return;
    const a = S.steps.indexOf(s), bIdx = S.steps.indexOf(rows[k]); [S.steps[a],S.steps[bIdx]] = [S.steps[bIdx],S.steps[a]]; save(); render(); return; }
  if(d.ind){ const s = S.steps.find(x=>x.id===d.ind); s.lvl = Math.max(0,Math.min(2,s.lvl+(+d.d))); save(); render(); return; }
  if(d.val){ const t = cur(); t.validated = d.val==="yes"; t.valSet = true; save(); render(); return; }
  if(d.gw){ const f = S.fails.find(x=>x.id===d.id); f.gw = f.gw||[]; const i = f.gw.indexOf(d.gw); i<0?f.gw.push(d.gw):f.gw.splice(i,1); save(); render(); return; }
  if(d.pif){ const f = S.fails.find(x=>x.id===d.id); f.pifs = f.pifs||[]; const i = f.pifs.indexOf(d.pif); i<0?f.pifs.push(d.pif):f.pifs.splice(i,1); save(); render(); return; }
  if(d.ft){ const f = S.fails.find(x=>x.id===d.id); f.ftype = f.ftype===d.ft?"":d.ft; save(); render(); return; }
  if(d.fd){ const f = S.fails.find(x=>x.id===d.fd); f[d.f] = f[d.f]===d.v?"":d.v; save(); render(); return; }
  if(d.addm){ const f = S.fails.find(x=>x.id===d.addm); f.meas = f.meas||[]; f.meas.push({id:uid("m"),text:"",hier:5,pm:"Prevent",alarp:"Decide",reason:"",owner:"",due:"",status:"Open"}); save(); render(); return; }
  if(d.alarp){ const f = S.fails.find(x=>x.id===d.fid); const m = f.meas.find(x=>x.id===d.mid); m.alarp = d.alarp; save(); render(); return; }
  if(d.delm){ const f = S.fails.find(x=>x.id===d.fid); f.meas = f.meas.filter(x=>x.id!==d.delm); save(); render(); return; }
});

function act(a){
  if(a==="new"){ S = blank(); persist(); curTask=""; go(0); toast("New study started. Fill in the basics, then go to Step 1."); return; }
  if(a==="example"){ S = example(); persist(); curTask=""; go(2); toast("Worked example opened and saved in this browser."); return; }
  if(a==="open"){ const i = document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange = () => { const f = i.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => {
      try{ const d = JSON.parse(r.result); if(!d||!d.meta) throw 0; S = migrate(d); loadDB(); if(DB[S.id] && !confirm("This study is already in this browser. Replace it with the file?")) { S = migrate(d); S.id = uid("study"); } persist(); curTask=""; go(0); toast("Study opened."); }
      catch(e){ alert("That file is not an SCTA study file."); } }; r.readAsText(f); }; i.click(); return; }
  if(!S) return;
  if(a==="addHaz"){ S.hazards.push({id:uid("haz"),ref:"MAH-"+String(S.hazards.length+1).padStart(2,"0"),title:"",src:"",cons:"",desc:""}); save(); render(); focusLast("[data-k=hazards][data-f=title]"); return; }
  if(a==="addTask"){ S.tasks.push({id:uid("sct"),ref:"SCT-"+String(S.tasks.length+1).padStart(2,"0"),title:"",type:"",who:"",proc:"",hazIds:S.hazards.length===1?[S.hazards[0].id]:[],conseq:"",human:"",why:"",ev:{},evNotes:"",wad:"",pifsSeen:"",goal:"",plan:"",validated:false}); save(); render(); focusLast("[data-k=tasks][data-f=title]"); return; }
  if(a==="addStep"){ S.steps.push({id:uid("st"),taskId:curTask,lvl:0,text:"",stop:"",why:""}); save(); render(); focusLast("[data-k=steps][data-f=text]"); return; }
  if(a==="addFail"){ const st = stepsOf(curTask); S.fails.push({id:uid("f"),taskId:curTask,stepId:st.length?st[0].id:"",gw:[],desc:"",credible:"",mah:"",dropWhy:"",cons:"",safe:"",pifs:[],ftype:"",meas:[]}); save(); render(); focusLast("[data-k=fails][data-f=desc]"); return; }
  if(a==="print"){ window.print(); return; }
  if(a==="excel"){ downloadExcel(); return; }
  if(a==="csv"){ const rows = [["No.","Task","Failure","Action","Level","ALARP","Owner","Due","Status"]].concat(actions().map((x,i)=>[i+1,x.t.ref,x.f.desc,x.m.text,x.m.hier,x.m.alarp,x.m.owner,x.m.due,x.m.status]));
    saveBlob(new Blob(["﻿"+rows.map(r=>r.map(c=>{ const s = String(c==null?"":c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\r\n")],{type:"text/csv"}), fname()+"-actions.csv"); return; }
}
function focusLast(sel){ const all = document.querySelectorAll(sel); if(all.length) all[all.length-1].focus(); }
const fname = () => (S.meta.ref||S.meta.title||"scta-study").replace(/[^\w.-]+/g,"_");
function saveBlob(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1500); }
function downloadStudy(d){ saveBlob(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}), (d.meta.ref||d.meta.title||"scta-study").replace(/[^\w.-]+/g,"_")+".scta.json"); toast("Study file downloaded."); }

const CRC = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){ // files: [{name, data(Uint8Array)}], stored (no compression)
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const u16 = n => [n&255,(n>>>8)&255], u32 = n => [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const hdr = new Uint8Array([0x50,0x4b,3,4, ...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21), ...u32(crc),...u32(sz),...u32(sz), ...u16(nm.length),...u16(0)]);
    parts.push(hdr, nm, f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21), ...u32(crc),...u32(sz),...u32(sz), ...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nm);
    off += hdr.length + nm.length + sz;
  });
  const cdSize = central.reduce((s,a)=>s+a.length,0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xlsx(sheets){ // sheets: [{name, widths:[], rows:[[...]] }] first row = header
  const enc = new TextEncoder(), x = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col = i => { let s = ""; i++; while(i){ const m = (i-1)%26; s = String.fromCharCode(65+m)+s; i = Math.floor((i-1)/26); } return s; };
  const files = [];
  const add = (n, s) => files.push({name:n, data:enc.encode(s)});
  add("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`);
  add("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  add("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`);
  add("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add("xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF16243F"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFD6DCE5"/></left><right style="thin"><color rgb="FFD6DCE5"/></right><top style="thin"><color rgb="FFD6DCE5"/></top><bottom style="thin"><color rgb="FFD6DCE5"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf fontId="0" borderId="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>`);
  sheets.forEach((s,i)=>{
    const rows = s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((c,ci)=>{ const ref = col(ci)+(ri+1), st = ri===0?2:1;
      return (typeof c==="number") ? `<c r="${ref}" s="${st}"><v>${c}</v></c>` : `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${x(c)}</t></is></c>`; }).join("")}</row>`).join("");
    add(`xl/worksheets/sheet${i+1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${(s.widths||[]).map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData></worksheet>`);
  });
  return zip(files);
}
function downloadExcel(){
  const m = S.meta;
  const sheets = [
    {name:"Study", widths:[24,90], rows:[["Field","Value"],["Reference",m.ref],["Title",m.title],["Revision",m.rev],["Date",m.date],["Site",m.site],["Unit",m.unit],["Lead",m.lead],["Team",m.team],["Scope",m.scope],["SCT definition",m.sctDef],["First SCTA on site?",S.dec.first||""]]},
    {name:"1 Hazards", widths:[10,40,30,40,50], rows:[["Ref","Major accident hazard","Source","Worst credible outcome","How it happens"]].concat(S.hazards.map(h=>[h.ref,h.title,h.src,h.cons,h.desc]))},
    {name:"2 Tasks", widths:[9,45,22,20,12,12,16,40], rows:[["Ref","Safety critical task","Type","Who","Linked MAH","Consequence","Human involvement","Priority","Why chosen"].slice(0,9)].concat(sortedTasks().map(t=>[t.ref,t.title,t.type,t.who,(t.hazIds||[]).map(hazRef).join(", "),t.conseq,t.human,priority(t).label,t.why]))},
    {name:"3 Understand", widths:[9,11,11,11,40,40,40], rows:[["Task","Documents","Interviews","Observation","Evidence notes","Work as done vs imagined","PIFs noticed"]].concat(S.tasks.map(t=>[t.ref,t.ev&&t.ev.docs?"Yes":"No",t.ev&&t.ev.intv?"Yes":"No",t.ev&&t.ev.obs?"Yes":"No",t.evNotes,t.wad,t.pifsSeen]))},
    {name:"4 HTA", widths:[9,8,70,40], rows:[["Task","No.","Step","Stop / break down"]].concat(S.tasks.flatMap(t=>{ const n = stepNums(t.id); return [[t.ref,"0",t.goal||t.title,t.plan?"Plan 0: "+t.plan:""]].concat(stepsOf(t.id).map(s=>[t.ref,n[s.id],"    ".repeat(s.lvl)+s.text,s.stop==="stop"?"Stop: "+(s.why||""):s.stop==="more"?"Broken down":""])); }))},
    {name:"5 Failures", widths:[9,30,10,40,10,30,30,30,16], rows:[["Task","Step","Guidewords","Potential failure","Type","Consequence","Recovery & safeguards","PIFs","Kept / dropped"]].concat(S.fails.map(f=>{ const t = S.tasks.find(x=>x.id===f.taskId)||{}; return [t.ref,stepLabel(f.stepId),(f.gw||[]).join(" "),f.desc,f.ftype,f.cons,f.safe,(f.pifs||[]).join("; "),(f.credible==="no"||f.mah==="no")?"Dropped: "+(f.dropWhy||""):"Kept"]; }))},
    {name:"6 Measures", widths:[9,35,45,7,14,12,30,16,12,11], rows:[["Task","Failure","Measure","Level","Prevent / mitigate","ALARP","Reason","Owner","Due","Status"]].concat(allMeasures().map(x=>[x.t.ref,x.f.desc,x.m.text,+x.m.hier,x.m.pm,x.m.alarp==="Decide"?"Not decided":x.m.alarp==="Adopt"?"Adopted":"Rejected",x.m.reason,x.m.owner,x.m.due,x.m.status]))},
    {name:"Action register", widths:[6,9,35,45,7,16,12,11], rows:[["No.","Task","Failure","Action","Level","Owner","Due","Status"]].concat(actions().map((x,i)=>[i+1,x.t.ref,x.f.desc,x.m.text,+x.m.hier,x.m.owner,x.m.due,x.m.status||"Open"]))},
    {name:"7 Review", widths:[80,8], rows:[["Quality check","Met"]].concat(QCHECKS.map((q,i)=>[q,S.review.qc[i]?"Yes":"No"])).concat([["Feed back: "+(S.review.feedback||""),""],["Notes: "+(S.review.notes||""),""]])}
  ];
  saveBlob(xlsx(sheets), fname()+".xlsx");
  toast("Excel workbook downloaded.");
}
