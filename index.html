  if(!d){ d = document.createElement("dialog"); d.id = "aiDlg"; document.body.appendChild(d); }
  const k = aiKey(); let remembered = false; try{ remembered = !!localStorage.getItem(AI_KEY_STORE); }catch(e){}
  d.innerHTML = `<h2 style="margin-top:0">✨ AI assistant settings</h2>
    <p>The assistant uses <b>Claude</b> by Anthropic. It can read your QRA, HAZOP, fault tree, bow tie, SOP and interview documents and suggest entries for each step. You review every suggestion before it is added.</p>
    <div class="notice"><b>Option 1 — one click (your own API key).</b> Create a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (API keys). Use is paid per request to your Anthropic account. A typical step costs from a few cents up to about a dollar with large documents.
      <div style="margin-top:.6rem"><label class="l">Claude API key</label><input type="password" id="aiKeyIn" value="${esc(k)}" placeholder="sk-ant-…" autocomplete="off"></div>
      <label class="checks" style="margin-top:.4rem"><input type="checkbox" id="aiRemember" ${remembered||!k?"checked":""}> Remember on this computer (untick on a shared computer)</label>
      <p class="hint" style="margin:.4rem 0 0">The key is kept only in this browser and is sent only to Anthropic (api.anthropic.com). It is never put in study files or downloads.</p></div>
    <div class="notice good"><b>Option 2 — no key.</b> Leave the key empty. The app prepares the prompt; you paste it into Claude chat (claude.ai) and paste the answer back.</div>
    <div class="notice warn"><b>Before uploading documents</b>, check your company's rules on sharing them with an external AI service.</div>
    <div class="row" style="justify-content:flex-end"><span class="hint grow" id="aiTestOut"></span><button class="btn" data-aitest="1">Test key</button><button class="btn" data-aiclear="1">Remove key</button><button class="btn pri" data-aisave="1">Save</button><button class="btn" data-aiclose="1">Close</button></div>`;
  d.showModal();
}
async function aiTest(){
  const out = $("aiTestOut"), k = $("aiKeyIn").value.trim();
  if(!k){ out.textContent = "Enter a key first."; return; }
  out.textContent = "Testing…";
  try{ const c = new Anthropic({apiKey:k, dangerouslyAllowBrowser:true}); await c.models.retrieve(AI_MODEL); out.textContent = "✓ Key works."; }
  catch(e){ out.textContent = "✕ "+aiErrText(e); }
}

/* ---------- events ---------- */
async function aiAddFiles(list){
  const pool = AI.pickPool; if(!pool) return;
  AI.files[pool] = AI.files[pool]||[]; AI.error = "";
  for(const f of Array.from(list)){
    try{ aiStatus("Reading "+f.name+"…"); const x = await aiReadFile(f); if(x.kind==="text" && !x.text.trim()) throw new Error(f.name+": no text found in it."); AI.files[pool].push(x); }
    catch(e){ AI.error = e.message||String(e); AI.errStep = view; }
  }
  const total = AI.files[pool].reduce((a,f)=>a+(f.data?f.data.length:0),0);
  if(total > 28e6) AI.error = "These files add up to more than about 20 MB, which is over the limit for one request. Remove some.";
  AI.status = ""; render();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return; const d = b.dataset;
  if(b.id==="bAI" || d.aiset){ e.preventDefault(); aiSettings(); return; }
  if(d.aiclose){ $("aiDlg").close(); return; }
  if(d.aitest){ aiTest(); return; }
  if(d.aisave){ aiSetKey($("aiKeyIn").value.trim(), $("aiRemember").checked); $("aiDlg").close(); toast(aiKey()?"AI key saved. The assistant now works in one click.":"No key set. The assistant will use copy and paste."); render(); return; }
  if(d.aiclear){ aiSetKey(""); $("aiKeyIn").value = ""; $("aiTestOut").textContent = "Key removed."; render(); return; }
  if(!S) return;
  if(d.aipick){ e.preventDefault(); AI.pickPool = b.closest("[data-aidrop]").dataset.aidrop; $("aiFile").click(); return; }
  if(d.aidelf!=null){ e.preventDefault(); const pool = b.closest("[data-aidrop]").dataset.aidrop; AI.files[pool].splice(+d.aidelf,1); render(); return; }
  if(d.airun){ e.preventDefault(); aiRun(+d.airun); return; }
  if(d.aicopy){ e.preventDefault(); const p = AI.paste.prompt;
    (navigator.clipboard ? navigator.clipboard.writeText(p) : Promise.reject()).then(()=>toast("Prompt copied. Paste it into Claude."), ()=>{ const ta = document.createElement("textarea"); ta.value = p; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Prompt copied."); }); return; }
  if(d.aiuse){ e.preventDefault(); const step = AI.paste.step, pool = AI.paste.pool;
    try{ const data = aiParse($("aiReply").value); AI.result = {step, pool, items:aiItems(step, data)}; AI.paste = null; AI.error = ""; }
    catch(err){ AI.error = "Could not read that reply: "+(err.message||err)+" Make sure you copied all of Claude's answer."; AI.errStep = step; }
    render(); return; }
  if(d.aicancel){ e.preventDefault(); AI.result = null; AI.paste = null; AI.error = ""; render(); return; }
  if(d.aiapply){ e.preventDefault(); const r = AI.result; let n = 0;
    document.querySelectorAll("[data-aisel]").forEach(cb=>{ const x = r.items[+cb.dataset.aisel]; if(cb.checked && x && x.apply){ x.apply(); n++; } });
    AI.result = null; save(); render(); toast(n ? `${n} suggestion${n>1?"s":""} added. Review and edit them below.` : "Nothing selected."); return; }
});
document.addEventListener("change", e=>{ if(e.target.id==="aiFile"){ aiAddFiles(e.target.files); e.target.value = ""; } });
document.addEventListener("input", e=>{ const el = e.target; if(el.dataset && el.dataset.ainotes){ AI.notes[el.dataset.ainotes] = el.value; } });
document.addEventListener("dragover", e=>{ const z = e.target.closest && e.target.closest("[data-aidrop]"); if(z){ e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const z = e.target.closest && e.target.closest("[data-aidrop]"); if(z) z.classList.remove("over"); });
document.addEventListener("drop", e=>{ const z = e.target.closest && e.target.closest("[data-aidrop]"); if(z){ e.preventDefault(); AI.pickPool = z.dataset.aidrop; aiAddFiles(e.dataTransfer.files); } });


/* ---------------- boot ---------------- */
loadDB();
(function(){
  const h = (location.hash||"").slice(1).split("/");
  if(h[0] && DB[h[0]]){ S = migrate(DB[h[0]]); go(h[1]||0); } else go("home");
})();
window.addEventListener("beforeunload", ()=>{ if(S) persist(); });
</script>
</body>
</html>
