function ProcedurePreview({st,opt}){
  const m=procedureModel(st,opt);
  return html`<div class="doc"><div class="hdr"><div><h1>${m.title}</h1><div>${m.site}</div></div><div style="text-align:right">Revision: ${m.revision}<br/>Issue date: ${m.date}${st.meta.isExample?html`<br/><b style="color:#9b1c10">EXAMPLE</b>`:null}</div></div>
    ${m.preconditions?html`<h2>Preconditions</h2><div class="box">${m.preconditions}</div>`:null}
    <h2>Process overview</h2><div class="box">${m.overview.map(o=>html`<div key=${o.num}>${o.num}  ${o.label}</div>`)}</div>
    ${m.sections.map(s=>html`<div key=${s.num}><h2>${s.num}  ${s.label}</h2>${s.plan?html`<p style="margin:0 0 6px;font-style:italic">Plan: ${s.plan}</p>`:null}
      <div style="overflow-x:auto"><table><thead><tr>${opt.steps?html`<th>Step</th>`:null}<th>Description</th>${opt.role?html`<th>Role</th>`:null}<th>✓</th><th>Comments</th></tr></thead><tbody>
        ${s.rows.map(r=>html`<tr key=${r.id} class=${r.crit?'crit':''}>${opt.steps?html`<td style="white-space:nowrap">${r.num}</td>`:null}<td style=${{paddingLeft:7+r.depth*16+'px',fontWeight:r.depth===0&&s.rows.some(x=>x.depth>0)?600:400}}>${r.label}</td>${opt.role?html`<td>${r.abbr||r.role}</td>`:null}<td>☐</td>
          <td>${r.warning?html`<div class="warn">WARNING: ${r.warning}</div>`:null}${r.plan?html`<div><i>Plan: ${r.plan}</i></div>`:null}${r.comments.map((c,i)=>html`<div key=${i}>${c}</div>`)}${r.photos.map(p=>html`<img key=${p.id} src=${p.data} alt=${p.caption}/>`)}</td></tr>`)}
      </tbody></table></div></div>`)}
  </div>`;
}
function Outputs({st,update,notify,ui,setUi}){
  const tab=ui.outTab||'procedure'; const [opt,setOpt]=useState({steps:true,role:true,errors:false,improvements:true,warnings:true,highlight:true,photos:true}); const [busy,setBusy]=useState('');
  const run=async(label,fn)=>{ setBusy(label); try{ await fn(); }catch(e){ console.error(e); notify('Export failed: '+(e&&e.message||e)); } setBusy(''); };
  const base=safeName(st.meta.title);
  const o=(k,l)=>html`<label class="row small" style="gap:6px" key=${k}><input type="checkbox" checked=${opt[k]} onChange=${e=>setOpt(Object.assign({},opt,{[k]:e.target.checked}))}/> ${l}</label>`;
  const nums=numbering(st.maps.wad);
  const comp=competenceRows(st);
  return html`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="seg" role="tablist">${[['procedure','Risk-informed procedure'],['competence','Competence sheet'],['downloads','Reports and files']].map(([k,l])=>html`<button key=${k} role="tab" aria-pressed=${tab===k} onClick=${()=>setUi({outTab:k})}>${l}</button>`)}</div>
    ${tab==='procedure'?html`<div class="split wide-left"><div style="min-width:0;overflow-x:auto"><${ProcedurePreview} st=${st} opt=${opt}/></div>
      <div class="panel sticky"><div class="panel-h"><h3>Report options</h3></div><div class="panel-b">${o('steps','Add Steps column')}${o('role','Add Role column')}${o('errors','Add error description and consequences to Comments')}${o('improvements','Add agreed procedure and supervision controls to Comments')}${o('warnings','Show warnings')}${o('highlight','Highlight critical and High-risk steps')}${o('photos','Include photos')}
        <button class="btn primary" disabled=${!!busy} onClick=${()=>run('proc',async()=>{ const b=await buildProcedureDocx(st,opt); await saveFile(base+'_procedure.docx',b,notify); })}>${busy==='proc'?'Building…':'Download Word (.docx)'}</button>
        <p class="small faint" style="margin:0">The procedure is built from the work-as-done map: one table per task, in task order.</p></div></div></div>`:null}
    ${tab==='competence'?html`<div style="display:flex;flex-direction:column;gap:12px">
      <p class="small muted" style="margin:0;max-width:90ch">Critical and High-risk steps need written competence requirements: what a critical deviation looks like, and the knowledge, skills and experience that prevent it. Training improvements from stage 7 can be pulled in.</p>
      ${comp.map(r=>{ const c=r.c; const setC=(k,v)=>update(s=>{ s.competence[r.n.id]=Object.assign({},s.competence[r.n.id]||{},{[k]:v}); }); const trn=st.analyses.filter(a=>a.nodeId===r.n.id).flatMap(a=>(a.improvements||[]).filter(i=>i.level==='TRN'&&i.status!=='Rejected').map(i=>i.text));
        return html`<div class="card" key=${r.n.id}><div class="card-h"><span class="code">${r.num}</span><b>${r.n.label}</b><${RiskPill} r=${r.n.risk}/>${r.n.critical?html`<span class="pill sig">critical</span>`:null}<span class="grow"></span>${trn.length?html`<button class="btn sm" onClick=${()=>setC('knowledge',[c.knowledge,...trn].filter(Boolean).join('\n'))}>Pull ${trn.length} training improvement${trn.length>1?'s':''}</button>`:null}</div>
          <${Field} label="Critical deviation"><${Txt} id=${'cd-'+r.n.id} rows="2" value=${c.criticalDeviation} onChange=${v=>setC('criticalDeviation',v)}/><//>
          <div class="grid3"><${Field} label="Knowledge"><${Txt} id=${'ck-'+r.n.id} rows="3" value=${c.knowledge} onChange=${v=>setC('knowledge',v)}/><//><${Field} label="Skills"><${Txt} id=${'cs-'+r.n.id} rows="3" value=${c.skills} onChange=${v=>setC('skills',v)}/><//><${Field} label="Experience"><${Txt} id=${'ce-'+r.n.id} rows="3" value=${c.experience} onChange=${v=>setC('experience',v)}/><//></div>
          <${Field} label="Reference document"><${Txt} id=${'cr-'+r.n.id} value=${c.refDoc} onChange=${v=>setC('refDoc',v)}/><//></div>`; })}
      ${!comp.length?html`<div class="panel"><div class="empty">No critical or High-risk steps yet. Mark them in stage 4.</div></div>`:html`<div><button class="btn primary" disabled=${!!busy} onClick=${()=>run('comp',async()=>{ await saveFile(base+'_competence.docx',await buildCompetenceDocx(st),notify); })}>${busy==='comp'?'Building…':'Download competence sheet (.docx)'}</button></div>`}
    </div>`:null}
    ${tab==='downloads'?html`<div class="grid2">
      ${[['report','Full SHERPA report','Word, landscape: study details, method, task map, differences, screening, error analysis, PIFs, action list, design requirements, competence, traceability and open items.','Download .docx',async()=>saveFile(base+'_SHERPA_report.docx',await buildReportDocx(st),notify)],
         ['xlsx','Analysis workbook','Excel with one sheet each for study, task map, procedure, differences, risk assessment grid, PIF ratings, action list and competence. Filters on every sheet.','Download .xlsx',async()=>saveFile(base+'_SHERPA.xlsx',await buildXlsx(st),notify)],
         ['csv','Action list','Every improvement with priority, owner, due date and status, for your action tracker.','Download .csv',async()=>saveFile(base+'_actions.csv',toCSV(actionRows(st)),notify)],
         ['svg','Task map picture','The work-as-done map as a vector drawing, for reports and slides.','Download .svg',async()=>saveFile(base+'_task_map.svg',diagramSVG(st,st.maps.wad,{colorBy:'agent',forExport:true}),notify)],
         ['json','Study file','The whole study, to reopen later, share with a colleague or keep under version control.','Save .sherpa.json',async()=>saveFile(base+'.sherpa.json',JSON.stringify(st,null,1),notify)]].map(([k,t,d,b,fn])=>html`<div class="card" key=${k}><h3>${t}</h3><p class="small muted" style="margin:0">${d}</p><div><button class="btn primary" disabled=${!!busy} onClick=${()=>run(k,fn)}>${busy===k?'Building…':b}</button></div></div>`)}
    </div>`:null}
  </div>`;
}

/* ===================== Grid ===================== */
function Grid({st,update,go,setUi}){
  const wad=st.maps.wad; const nums=numbering(wad); const mode=st.meta.ratingMode; const [onlyCred,setOnlyCred]=useState(true);
  const ord=Object.fromEntries(leavesOf(wad).map((n,i)=>[n.id,i]));
  const list=st.analyses.filter(a=>wad.nodes[a.nodeId]&&(!onlyCred||a.credible)).sort((a,b)=>(ord[a.nodeId]-ord[b.nodeId])||a.mode.localeCompare(b.mode));
  const setA=(id,k,v)=>update(s=>{ const a=s.analyses.find(x=>x.id===id); if(a) a[k]=v; });
  const setN=(id,k,v)=>update(s=>{ s.maps.wad.nodes[id][k]=v; });
  const ta=(id,val,fn)=>html`<textarea id=${id} rows="2" value=${val||''} onInput=${e=>fn(e.target.value)} style="min-width:160px"></textarea>`;
  return html`<div style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><label class="row small"><input type="checkbox" checked=${onlyCred} onChange=${e=>setOnlyCred(e.target.checked)}/> Credible error modes only</label><span class="small faint">${list.length} rows · one row per error mode, as in the demo data grid. Edit any cell; open a row in its stage for ratings and controls.</span></div>
    <div class="tbl-wrap" style="max-height:72vh;overflow:auto"><table class="tbl"><thead><tr><th>ID</th><th>Description</th><th>A/P</th><th>Warnings</th><th>Activity</th><th>Failure mode</th><th>Error description</th><th>Error type</th><th>Consequences</th><th>Consequence type</th><th>Existing controls / recovery</th><th>PIFs</th><th>Improvements</th><th class="num">Score</th><th>Pri.</th><th>Analyst notes</th><th></th></tr></thead><tbody>
      ${list.map(a=>{ const n=wad.nodes[a.nodeId]; return html`<tr key=${a.id}><td class="num">${nums[n.id]}</td><td class="small" style="min-width:180px">${n.label}</td><td class="small">${agentLabel(st,n.agents)}</td><td>${ta('gw-'+a.id,n.warnings,v=>setN(n.id,'warnings',v))}</td>
        <td class="small">${ACTIVITY_TYPES.find(x=>x.code===n.activity)?.name||''}</td><td class="small"><span class="code">${a.mode}</span> ${modeOf(a.mode)?.name||''}</td>
        <td>${ta('ge-'+a.id,a.errorDesc,v=>setA(a.id,'errorDesc',v))}</td><td><select id=${'gt-'+a.id} value=${a.errorType} onChange=${e=>setA(a.id,'errorType',e.target.value)} style="min-width:120px"><option value="">—</option>${ERROR_TYPES.map(t=>html`<option key=${t.v}>${t.v}</option>`)}</select></td>
        <td>${ta('gc-'+a.id,a.consequence,v=>setA(a.id,'consequence',v))}</td><td class="small">${(a.consTypes||[]).join('; ')}</td><td>${ta('gx-'+a.id,a.controls,v=>setA(a.id,'controls',v))}</td>
        <td class="small" style="min-width:150px">${(a.pifs||[]).map(p=>html`<div key=${p.id}>${p.name} <b class="mono">${p.baseline}</b></div>`)}</td><td class="small" style="min-width:180px">${(a.improvements||[]).map(i=>html`<div key=${i.id}>[${LEVEL[i.level]?.name}] ${i.text}</div>`)}</td>
        <td class="num">${anScore(a,'baseline',mode)??''}</td><td><${PriPill} p=${priorityOf(a,n,mode)}/></td><td>${ta('gn-'+a.id,a.notes,v=>setA(a.id,'notes',v))}</td>
        <td><button class="btn sm" onClick=${()=>{ setUi({pifAn:a.id,ctlAn:a.id,errStep:n.id}); go(a.pifs.length?'controls':'pifs'); }}>Open</button></td></tr>`; })}
      ${!list.length?html`<tr><td colspan="17" class="empty">No error modes yet. Add them in stage 5.</td></tr>`:null}
    </tbody></table></div></div>`;
}

/* ===================== App shell ===================== */
const STAGE_INFO={
  setup:['Set up the study','Name the study and its goal, record who is in the team and who described the work, and list the roles and locations involved.'],
  map:['Map the task','Bring in the procedure as work as imagined, then build work as done with the people who do the job. Each step keeps its procedure number.'],
  compare:['Compare work as imagined with work as done','Every difference between the procedure and real practice, with a reason and a decision.'],
  screen:['Screen the steps','Rate each lowest-level step High, Medium or Low by what could happen if it went wrong. Medium and High steps go forward.'],
  errors:['Predict human errors','For each step carried forward, choose the activity type and tick each credible way it could go wrong.'],
  pifs:['Assess performance influencing factors','For each credible error mode, rate the conditions that make it more or less likely, and give the reason.'],
  controls:['Improve controls','For every PIF rated 75 or 100, agree the strongest practical control and the rating you expect afterwards.'],
  outputs:['Outputs','Turn the analysis into a risk-informed procedure, a competence sheet, a full report and an action list.'],
  grid:['Analysis grid','All error modes in one spreadsheet view, matching the demo data grid columns.']
};
function App(){
  const [study,setStudy]=useState(null); const [stage,setStage]=useState('setup'); const [ui,setUiS]=useState({});
  const [modal,setModal]=useState(null); const [toast,setToast]=useState(''); const [gloss,setGloss]=useState(false); const [saved,setSaved]=useState('');
  const setUi=p=>setUiS(u=>Object.assign({},u,p));
  const notify=useCallback(m=>{ setToast(m); clearTimeout(window.__t); window.__t=setTimeout(()=>setToast(''),3200); },[]);
  const update=useCallback(fn=>setStudy(prev=>{ const n=clone(prev); fn(n); n.updated=new Date().toISOString(); return n; }),[]);
  useEffect(()=>{ if(!study) return; const t=setTimeout(()=>{ const ok=saveStudyLS(study); setSaved(ok?'Saved in this browser '+new Date().toTimeString().slice(0,5):'Not saved: browser storage is unavailable. Use "Save study file".'); },700); return ()=>clearTimeout(t); },[study]);
  const open=s=>{ setStudy(s); setUiS({}); setStage(leavesOf(s.maps.wad).length?'map':'setup'); window.scrollTo(0,0); };
  const g=useMemo(()=>study?gates(study):{},[study]);
  const go=k=>{ setStage(k); window.scrollTo(0,0); };
  const ask=m=>setModal(m);
  const saveJson=()=>saveFile(safeName(study.meta.title)+'.sherpa.json',JSON.stringify(study,null,1),notify);
  if(!study) return html`<${React.Fragment}><header class="bar"><div class="wrap bar-in"><div class="brand">SHERPA Studio <small>risk2safe</small></div><span class="grow"></span><button class="btn ghost" onClick=${()=>setGloss(true)}>Glossary</button></div></header>
    <main><${Home} open=${open} notify=${notify} ask=${ask}/></main>${gloss?html`<${Glossary} close=${()=>setGloss(false)}/>`:null}<${Modal} m=${modal} close=${()=>setModal(null)}/>${toast?html`<div class="toast" role="status">${toast}</div>`:null}<//>`;
  const idx=STAGES.findIndex(s=>s.k===stage); const next=STAGES[idx+1]?.k; const info=STAGE_INFO[stage];
  const props={st:study,update,ask,notify,ui,setUi,go};
  return html`<${React.Fragment}>
    <header class="bar"><div class="wrap bar-in"><div class="brand">SHERPA Studio <small>risk2safe</small></div>
      <div class="study-name"><button class="btn sm ghost" onClick=${()=>{ saveStudyLS(study); setStudy(null); }}>← All studies</button><span title=${study.meta.title}>${study.meta.title}</span>${study.meta.isExample?html`<span class="pill sig">example</span>`:null}</div>
      <span class="save-state hide-sm">${saved}</span>
      <div class="bar-actions"><button class="btn sm" onClick=${saveJson}>Save study file</button><button class="btn sm ghost" onClick=${()=>setGloss(true)}>Glossary</button></div></div></header>
    <nav class="rail" aria-label="SHERPA stages"><div class="wrap rail-in">${STAGES.map(s=>{ const iss=g[s.k]; const ok=iss&&!iss.length; const dot=(s.k==='outputs'||s.k==='grid')?'':ok?'ok':'warn';
      return html`<button key=${s.k} class="stage" aria-current=${stage===s.k?'step':undefined} onClick=${()=>go(s.k)}><span class="num">${s.n}</span><span class="lbl">${s.l}</span>${dot?html`<span class=${'dot '+dot} title=${ok?'Complete':(iss.length+' open item(s)')}></span>`:null}</button>`; })}</div></nav>
    <main><div class="wrap" style="display:flex;flex-direction:column;gap:14px">
      ${study.meta.isExample&&stage==='setup'?html`<div class="notice small">This is an example study built from the HRA "Watch SHERPA in Action" webinar demo. Entries marked "example" were added to show the workflow. Replace them with your own data before using any output.</div>`:null}
      <div class="page-head"><div><div class="eyebrow">Stage ${STAGES[idx].n} of ${STAGES.length}</div><h2>${info[0]}</h2><p>${info[1]}</p></div></div>
      ${stage==='setup'?html`<${Setup} ...${props}/>`:null}
      ${stage==='map'?html`<${MapStage} ...${props}/>`:null}
      ${stage==='compare'?html`<${Compare} ...${props}/>`:null}
      ${stage==='screen'?html`<${Screen} ...${props}/>`:null}
      ${stage==='errors'?html`<${Errors} ...${props}/>`:null}
      ${stage==='pifs'?html`<${Pifs} ...${props}/>`:null}
      ${stage==='controls'?html`<${Controls} ...${props}/>`:null}
      ${stage==='outputs'?html`<${Outputs} ...${props}/>`:null}
      ${stage==='grid'?html`<${Grid} ...${props}/>`:null}
      ${g[stage]&&stage!=='outputs'&&stage!=='grid'?html`<${Gate} issues=${g[stage]} stage=${stage} st=${study} update=${update} next=${next} go=${go}/>`:null}
    </div></main>
    ${gloss?html`<${Glossary} close=${()=>setGloss(false)}/>`:null}<${Modal} m=${modal} close=${()=>setModal(null)}/>${toast?html`<div class="toast" role="status">${toast}</div>`:null}<//>`;
}
function Glossary({close}){
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') close(); }; window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[]);
  return html`<div class="scrim" onClick=${e=>{if(e.target===e.currentTarget) close();}}><aside class="drawer" role="dialog" aria-label="Glossary"><div class="row" style="justify-content:space-between"><h2>Glossary</h2><button class="btn" onClick=${close}>Close</button></div>
    <p class="small muted" style="margin:0">Terms from the SHERPA method, as used in this studio.</p>
    <dl class="gloss">${GLOSSARY.map(([t,d])=>html`<div key=${t}><dt>${t}</dt><dd>${d}</dd></div>`)}</dl>
    <div><h3 style="margin-bottom:6px">Rating scale</h3>${RATING.map(r=>html`<div key=${r.v} class="row small"><span class="code" style="min-width:36px;text-align:center">${r.v}</span>${r.l} — ${r.h}</div>`)}</div>
    <div><h3 style="margin-bottom:6px">Priority bands</h3><div class="small muted">P1: High step with error-mode score 60 or more. P2: High step with a lower score, or Medium step with 60 or more. P3: everything else.</div></div>
  </aside></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

</script>
